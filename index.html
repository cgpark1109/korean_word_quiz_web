<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Korean Word Quiz</title>
    <link rel="stylesheet" href="./css/base.css?v=20260624-3" />
    <style>
      :root {
        --bg: #f5f0e8;
        --card-bg: #ede5d5;
        --border: #c9b99a;
        --gold: #8b6914;
        --text-primary: #3d2b1a;
        --text-secondary: #6b4f2a;
        --text-muted: #9b8b7a;
        --radius: 12px;
        --radius-sm: 8px;
        --shadow-soft: 0 2px 10px rgba(61, 43, 26, 0.08);
        --shadow-hero: 0 4px 16px rgba(139, 105, 20, 0.14);
      }

      body.home-page {
        min-height: 100dvh;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        padding-bottom: 20px;
        background: var(--bg, #f5f0e8);
        color: var(--text-primary, #3d2b1a);
      }
      .header {
        padding: 4px 20px 10px;
        text-align: center;
        position: relative;
        overflow: hidden;
      }
      .header-toolbar {
        position: relative;
        z-index: 2;
        display: grid;
        grid-template-columns: 40px 1fr 40px;
        align-items: center;
        gap: 8px;
      }
      .header-title-wrap {
        min-width: 0;
        text-align: center;
        position: relative;
        z-index: 2;
        padding-top: 1.25rem;
      }
      .header-icon-btn {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 40px;
        height: 40px;
        border-radius: 50%;
        border: 1.5px solid var(--border);
        background: var(--card-bg);
        font-size: 20px;
        line-height: 1;
        text-decoration: none;
        cursor: pointer;
        transition:
          transform 0.1s,
          background 0.15s;
        -webkit-tap-highlight-color: transparent;
      }
      .header-icon-btn:active {
        transform: scale(0.94);
        background: var(--bg);
      }
      .notice-popup-overlay {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        box-sizing: border-box;
        background: rgba(45, 32, 18, 0.45);
      }
      .notice-popup-card {
        width: 100%;
        max-width: 320px;
        padding: 24px 22px 20px;
        border-radius: var(--radius);
        border: 1px solid var(--border);
        background: var(--card-bg);
        text-align: center;
        box-shadow: 0 12px 32px rgba(61, 43, 26, 0.18);
      }
      .notice-popup-title {
        font-size: 18px;
        font-weight: 700;
        color: var(--text-primary);
        margin: 0 0 6px;
      }
      .notice-popup-date {
        font-size: 12px;
        color: var(--text-muted);
        margin: 0 0 12px;
      }
      .notice-popup-message {
        font-size: 14px;
        color: var(--text-secondary);
        line-height: 1.6;
        margin: 0 0 20px;
        white-space: pre-line;
        text-align: left;
      }
      .notice-popup-btn {
        width: 100%;
        border: none;
        border-radius: var(--radius-sm);
        background: var(--gold);
        color: #fff;
        font-size: 15px;
        font-weight: 600;
        padding: 12px 16px;
        cursor: pointer;
      }
      .notice-popup-btn:active {
        opacity: 0.9;
      }
      .header-decoration {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        pointer-events: none;
        overflow: hidden;
      }
      .deco-word {
        position: absolute;
        font-size: 48px;
        font-weight: 700;
        color: var(--text-primary);
        opacity: 0.08;
        white-space: nowrap;
      }
      .app-title {
        font-size: 28px;
        font-weight: 700;
        color: var(--text-primary);
        line-height: 1.1;
      }
      .app-subtitle {
        display: block;
        font-size: 14px;
        font-weight: 600;
        color: var(--text-secondary);
        margin-top: 6px;
        line-height: 1.35;
        letter-spacing: 0.01em;
      }
      .home-content {
        display: flex;
        flex-direction: column;
        gap: 14px;
        padding: 0 20px 10px;
      }
      .home-card {
        border: 1px solid var(--border, #c9b99a);
        border-radius: var(--radius, 12px);
        background: var(--card-bg, #ede5d5);
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        box-shadow: var(--shadow-soft);
        box-sizing: border-box;
        width: 100%;
      }
      .hero-card {
        border-color: var(--gold, #8b6914);
        background: linear-gradient(180deg, #f0e6d2 0%, #ede5d5 100%);
        box-shadow: var(--shadow-hero);
      }
      .hero-title {
        font-size: 18px;
        font-weight: 700;
        color: var(--text-primary, #3d2b1a);
        line-height: 1.25;
      }
      .mission-title {
        font-size: 14px;
        font-weight: 700;
        color: var(--text-primary, #3d2b1a);
        line-height: 1.3;
        letter-spacing: 0.02em;
        text-transform: uppercase;
      }
      .mission-meta,
      .hero-desc {
        font-size: 13px;
        color: var(--text-secondary, #6b4f2a);
        line-height: 1.45;
      }
      .mission-progress {
        font-size: 13px;
        font-weight: 600;
        color: var(--text-primary, #3d2b1a);
      }
      .progress-track {
        width: 100%;
        height: 6px;
        border-radius: 999px;
        background: rgba(61, 43, 26, 0.08);
        overflow: hidden;
      }
      .progress-fill {
        height: 100%;
        width: 0%;
        border-radius: 999px;
        background: var(--gold, #8b6914);
        transition: width 0.2s ease;
      }
      .home-btn {
        display: block;
        width: 100%;
        box-sizing: border-box;
        margin-top: 2px;
        padding: 14px 16px;
        border: none;
        border-radius: var(--radius-sm, 8px);
        background: var(--gold, #8b6914);
        color: #fff8e7;
        font-size: 16px;
        font-weight: 600;
        font-family: inherit;
        text-align: center;
        cursor: pointer;
        -webkit-appearance: none;
        appearance: none;
        -webkit-tap-highlight-color: transparent;
        text-decoration: none;
        line-height: 1.2;
      }
      .home-btn:active:not(:disabled) {
        opacity: 0.92;
        transform: scale(0.99);
      }
      .home-btn:disabled {
        opacity: 0.55;
        cursor: default;
      }
      .home-btn.secondary {
        background: transparent;
        color: var(--text-secondary, #6b4f2a);
        border: 1.5px solid var(--border, #c9b99a);
      }
      .section-label {
        font-size: 13px;
        font-weight: 600;
        color: var(--text-muted);
        letter-spacing: 0.08em;
        text-transform: uppercase;
        padding: 4px 20px 2px;
      }
      .level-list {
        display: flex;
        flex-direction: column;
        gap: 12px;
        padding: 0 20px 12px;
      }
      .studio-promo-wrap {
        padding: 4px 20px 20px;
        margin-bottom: 8px;
      }
      .studio-promo-link {
        display: flex;
        align-items: center;
        gap: 10px;
        width: 100%;
        padding: 12px 14px;
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        background: var(--card-bg);
        text-decoration: none;
        color: inherit;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      .studio-promo-link:active {
        background: var(--bg);
      }
      .studio-promo-badge {
        flex-shrink: 0;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        color: var(--text-muted);
        padding: 4px 6px;
        border-radius: 4px;
        border: 1px solid var(--border);
        background: var(--bg);
      }
      .studio-promo-text {
        flex: 1;
        font-size: 14px;
        font-weight: 600;
        color: var(--text-secondary);
        line-height: 1.3;
      }
      .studio-promo-arrow {
        font-size: 18px;
        color: var(--border);
        flex-shrink: 0;
      }
      .level-card {
        display: flex;
        align-items: center;
        gap: 16px;
        min-height: 84px;
        padding: 14px 18px;
        cursor: pointer;
        text-align: left;
        width: 100%;
        background: var(--card-bg, #ede5d5);
        border: 1px solid var(--border, #c9b99a);
        border-radius: var(--radius, 12px);
        box-shadow: var(--shadow-soft);
        transition: transform 0.1s;
        -webkit-appearance: none;
        appearance: none;
        font-family: inherit;
        color: inherit;
        text-decoration: none;
        box-sizing: border-box;
      }
      .level-card.is-disabled {
        opacity: 0.5;
        pointer-events: none;
      }
      .review-wrong .level-icon {
        color: var(--wrong-text, #8b2020);
      }
      .review-learned .level-icon {
        color: var(--correct-text, #5c7a3e);
      }
      .level-icon {
        font-size: 28px;
        flex-shrink: 0;
      }
      .level-info {
        flex: 1;
        min-width: 0;
      }
      .level-name {
        font-size: 17px;
        font-weight: 700;
        color: var(--text-primary, #3d2b1a);
      }
      .level-desc {
        font-size: 13px;
        color: var(--text-secondary, #6b4f2a);
        margin-top: 3px;
        line-height: 1.35;
      }
      .level-sub {
        font-size: 12px;
        color: var(--text-muted, #9b8b7a);
        margin-top: 2px;
        line-height: 1.35;
      }
      .level-arrow {
        font-size: 20px;
        color: var(--border, #c9b99a);
        flex-shrink: 0;
      }
      @media (min-width: 520px) {
        .header {
          padding: 10px 28px 16px;
        }
        .header-toolbar {
          grid-template-columns: 44px 1fr 44px;
          gap: 12px;
        }
        .header-title-wrap {
          padding-top: 1.35rem;
        }
        .header-icon-btn {
          width: 44px;
          height: 44px;
          font-size: 22px;
        }
        .app-title {
          font-size: 30px;
        }
        .app-subtitle {
          font-size: 15px;
        }
        .deco-word {
          font-size: 56px;
        }
        .section-label {
          font-size: 15px;
          padding: 0 28px 12px;
        }
        .level-list {
          gap: 14px;
          padding: 0 28px;
        }
        .level-card {
          min-height: 96px;
          padding: 16px 24px;
          gap: 20px;
        }
        .level-icon {
          font-size: 36px;
        }
        .level-name {
          font-size: 20px;
        }
        .level-desc {
          font-size: 14px;
        }
        .level-sub {
          font-size: 13px;
        }
        .hero-wrap,
        .mission-wrap {
          padding-left: 0;
          padding-right: 0;
        }
        .home-content {
          padding-left: 28px;
          padding-right: 28px;
        }
        .hero-title {
          font-size: 20px;
        }
        .hero-desc {
          font-size: 14px;
        }
        .level-list {
          padding-bottom: 12px;
        }
        .studio-promo-wrap {
          padding: 4px 28px 16px;
        }
      }
    </style>
    <script src="./js/app.js?v=20260624-9"></script>
  </head>
  <body class="home-page">
    <div class="header">
      <div class="header-decoration">
        <span class="deco-word" style="top: 10px; left: -10px">apple</span>
        <span class="deco-word" style="top: 0px; right: -5px; font-size: 36px"
          >school</span
        >
        <span class="deco-word" style="bottom: 0px; left: 20px; font-size: 40px"
          >friend</span
        >
        <span
          class="deco-word"
          style="bottom: 5px; right: 10px; font-size: 32px"
          >sky</span
        >
      </div>
      <div class="header-toolbar">
        <a
          href="notice.html"
          class="header-icon-btn"
          id="noticeLink"
          aria-label="Notice"
          title="Notice"
          >📢</a
        >
        <div class="header-title-wrap">
          <div class="app-title">Korean Word<br>Quiz</div>
          <div class="app-subtitle">Learn Korean Vocabulary</div>
        </div>
        <a
          href="settings.html"
          class="header-icon-btn"
          id="settingsLink"
          aria-label="Settings"
          title="Settings"
          >⚙️</a
        >
      </div>
    </div>

    <div class="home-content">
      <div class="home-card hero-card">
        <div class="hero-title" id="heroTitle">Start Your First Quiz</div>
        <div class="hero-desc" id="heroDesc">10 random words · All levels</div>
        <a
          class="home-btn"
          id="heroBtn"
          href="quiz.html?mode=random"
          >Start Quiz</a
        >
      </div>
    </div>

    <div class="section-label">Your Words</div>
    <p
      id="reviewLevelLabel"
      style="font-size: 12px; color: var(--text-muted); padding: 0 20px 8px; margin: 0"
    >
      All levels · tap to view words
    </p>

    <div class="level-list">
      <a class="level-card review-wrong is-disabled" id="reviewWrongLink" href="#">
        <span class="level-icon">✗</span>
        <div class="level-info">
          <div class="level-name">Wrong Answers</div>
          <div class="level-desc" id="reviewWrongMeta">No wrong answers yet</div>
        </div>
        <span class="level-arrow">›</span>
      </a>

      <a class="level-card review-learned is-disabled" id="reviewLearnedLink" href="#">
        <span class="level-icon">✓</span>
        <div class="level-info">
          <div class="level-name">Learned Words</div>
          <div class="level-desc" id="reviewLearnedMeta">No learned words yet</div>
        </div>
        <span class="level-arrow">›</span>
      </a>
    </div>

    <div class="studio-promo-wrap">
      <a class="studio-promo-link" id="moreAppsLink" href="more-apps.html">
        <span class="studio-promo-badge">Developer</span>
        <span class="studio-promo-text">More apps from GGOOK's Studio</span>
        <span class="studio-promo-arrow">›</span>
      </a>
    </div>

  </body>
</html>
