<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Notice – Korean Word Quiz</title>
  <link rel="stylesheet" href="./css/base.css?v=20260528-1">
  <style>
    .top-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px 20px 8px;
    }
    .back-btn {
      background: none;
      border: none;
      font-size: 22px;
      color: var(--text-secondary);
      cursor: pointer;
      padding: 4px;
    }
    .page-title {
      font-size: 17px;
      font-weight: 700;
      color: var(--text-primary);
      flex: 1;
    }
    .notice-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 8px 20px 24px;
    }
    .notice-item {
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--card-bg);
      padding: 14px 14px 12px;
    }
    .notice-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 4px;
    }
    .notice-date {
      font-size: 11px;
      color: var(--text-muted);
      margin-bottom: 8px;
    }
    .notice-message {
      font-size: 13px;
      color: var(--text-secondary);
      line-height: 1.6;
      white-space: pre-line;
    }
    .empty-text {
      margin: 20px;
      text-align: center;
      color: var(--text-muted);
      font-size: 13px;
    }
  </style>
  <script src="./js/app.js?v=20260528-1"></script>
</head>
<body>
  <div class="top-bar">
    <a class="back-btn" id="backBtn" href="index.html">←</a>
    <div class="page-title">Notices</div>
  </div>

  <div class="notice-list" id="noticeList"></div>
  <div class="empty-text" id="emptyText" style="display:none;">No notices available yet.</div>

  <script>
    const WEB_VERSION =
      new URLSearchParams(window.location.search).get('v') || '20260528-1';

    const backUrl = new URL('index.html', location.href);
    backUrl.searchParams.set('v', WEB_VERSION);
    document.getElementById('backBtn').href = backUrl.toString();

    function renderNoticeItem(item) {
      const el = document.createElement('article');
      el.className = 'notice-item';
      el.innerHTML = `
        <div class="notice-title">${item.title || 'Notice'}</div>
        <div class="notice-date">${item.date || '-'}</div>
        <div class="notice-message">${item.message || ''}</div>
      `;
      return el;
    }

    async function loadNoticePage() {
      try {
        const res = await fetch('./notice.json?v=' + encodeURIComponent(WEB_VERSION));
        const data = await res.json();
        const list = document.getElementById('noticeList');

        const notices = getActiveNotices(data).sort((a, b) => {
          const byDate = (b.date || '').localeCompare(a.date || '');
          if (byDate !== 0) return byDate;
          return (parseInt(b.revision, 10) || 1) - (parseInt(a.revision, 10) || 1);
        });

        if (!notices.length) {
          const fallback = [];
          if (data.popup?.active) {
            fallback.push({
              title: data.popup.title || 'Popup Notice',
              message: data.popup.message || '',
              date: getLocalDateKey(),
            });
          }
          if (data.banner?.active) {
            fallback.push({
              title: 'Banner Notice',
              message: data.banner.message || '',
              date: getLocalDateKey(),
            });
          }

          if (!fallback.length) {
            document.getElementById('emptyText').style.display = 'block';
            return;
          }
          fallback.forEach(item => list.appendChild(renderNoticeItem(item)));
          return;
        }

        notices.forEach(item => list.appendChild(renderNoticeItem(item)));
      } catch (e) {
        document.getElementById('emptyText').textContent = 'Failed to load notices.';
        document.getElementById('emptyText').style.display = 'block';
      }
    }

    loadNoticePage();
  </script>
</body>
</html>
