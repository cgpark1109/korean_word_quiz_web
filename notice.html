<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Notice – Korean Word Quiz</title>
  <link rel="stylesheet" href="./css/base.css?v=20260624-9">
  <style>
    body.notice-page {
      padding-bottom: 8px;
    }
    .top-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 16px 6px;
    }
    .back-btn {
      background: none;
      border: none;
      font-size: 20px;
      color: var(--text-secondary);
      cursor: pointer;
      padding: 2px;
      text-decoration: none;
      line-height: 1;
    }
    .page-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--text-primary);
      flex: 1;
    }
    .notice-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 0 16px 12px;
    }
    .notice-item {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--card-bg);
      padding: 10px 12px;
    }
    .notice-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-primary);
      line-height: 1.35;
      flex: 1;
      min-width: 0;
    }
    .notice-date {
      font-size: 11px;
      color: var(--text-muted);
      flex-shrink: 0;
      white-space: nowrap;
    }
    .empty-text {
      margin: 8px 16px 12px;
      text-align: center;
      color: var(--text-muted);
      font-size: 13px;
    }
  </style>
  <script src="./js/app.js?v=20260624-9"></script>
</head>
<body class="notice-page">
  <div class="top-bar">
    <a class="back-btn" id="backBtn" href="index.html">←</a>
    <div class="page-title">Notices</div>
  </div>

  <div class="notice-list" id="noticeList"></div>
  <div class="empty-text" id="emptyText" style="display:none;">No notices available yet.</div>

  <script>
    const WEB_VERSION =
      new URLSearchParams(window.location.search).get('v') || '20260624-9';

    const backUrl = new URL('index.html', location.href);
    backUrl.searchParams.set('v', WEB_VERSION);
    document.getElementById('backBtn').href = backUrl.toString();

    function renderNoticeItem(item) {
      const el = document.createElement('article');
      el.className = 'notice-item';
      el.innerHTML = `
        <div class="notice-title">${formatNoticeSummary(item)}</div>
        <div class="notice-date">${item.date || '-'}</div>
      `;
      return el;
    }

    async function loadNoticePage() {
      try {
        const data = await fetchBundledJson('notice.json', WEB_VERSION);
        const list = document.getElementById('noticeList');

        const notices = getActiveNotices(data).sort((a, b) => {
          const byDate = (b.date || '').localeCompare(a.date || '');
          if (byDate !== 0) return byDate;
          return (parseInt(b.revision, 10) || 1) - (parseInt(a.revision, 10) || 1);
        });

        if (!notices.length) {
          document.getElementById('emptyText').style.display = 'block';
          return;
        }

        notices.forEach(item => list.appendChild(renderNoticeItem(item)));
      } catch (e) {
        document.getElementById('emptyText').textContent = 'Failed to load notices.';
        document.getElementById('emptyText').style.display = 'block';
      }
    }

    loadNoticePage();
  </script>
</body>
</html>
