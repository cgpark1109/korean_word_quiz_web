<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Quiz – Korean Word Quiz</title>
  <link rel="stylesheet" href="./css/base.css?v=20260624-5" />
  <style>
    :root {
      --bg: #f5f0e8;
      --card-bg: #ede5d5;
      --border: #c9b99a;
      --gold: #8b6914;
      --text-primary: #3d2b1a;
      --text-secondary: #6b4f2a;
      --text-muted: #9b8b7a;
      --correct-bg: #eaf0e0;
      --correct-text: #5c7a3e;
      --wrong-bg: #f5e0e0;
      --wrong-text: #8b2020;
      --radius: 12px;
      --radius-sm: 8px;
    }
    body.quiz-page {
      display: flex;
      flex-direction: column;
      height: 100%;
      min-height: 100dvh;
      max-width: 100%;
      padding-bottom: 0;
    }
    .quiz-header {
      flex-shrink: 0;
    }
    .quiz-main {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
      justify-content: flex-start;
    }
    .quiz-center {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      gap: clamp(8px, 1.6vh, 14px);
      padding: clamp(2px, 1vh, 10px) 0 10px;
    }
    .quiz-bottom {
      flex-shrink: 0;
      margin-top: auto;
      padding-bottom: 12px;
    }
    .top-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px 20px 8px;
    }
    .back-btn {
      background: none;
      border: none;
      font-size: 22px;
      color: var(--text-secondary);
      cursor: pointer;
      padding: 4px;
      flex-shrink: 0;
    }
    .level-badge {
      font-size: 13px;
      font-weight: 600;
      color: var(--gold);
      text-transform: capitalize;
      flex: 1;
    }
    .progress-text {
      font-size: 13px;
      color: var(--text-muted);
      font-weight: 600;
    }
    .progress-bar-wrap {
      padding: 0 20px 16px;
    }
    .progress-bar-bg {
      background: var(--card-bg);
      border-radius: 99px;
      height: 6px;
      overflow: hidden;
    }
    .progress-bar-fill {
      height: 100%;
      background: var(--gold);
      border-radius: 99px;
      transition: width 0.3s ease;
    }
    .question-card {
      margin: 0 20px;
      padding: clamp(18px, 3vh, 28px) 20px;
      text-align: center;
      min-height: clamp(110px, 19vh, 140px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    .question-level-tag {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      color: var(--gold);
      letter-spacing: 0.04em;
      text-transform: uppercase;
      padding: 4px 10px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--bg);
    }
    .question-type-label {
      font-size: 12px;
      color: var(--text-muted);
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    .question-word {
      font-size: 30px;
      font-weight: 700;
      color: var(--text-primary);
      line-height: 1.3;
    }
    .question-word.small {
      font-size: 22px;
    }
    .question-hint {
      font-size: 13px;
      color: var(--text-muted);
      font-style: italic;
    }
    .hint-reward-wrap {
      margin: 0 20px;
      display: none;
    }
    .hint-reward-btn {
      width: 100%;
      border: 1.5px dashed var(--gold);
      border-radius: var(--radius-sm);
      background: transparent;
      color: var(--gold);
      font-size: 13px;
      font-weight: 600;
      padding: 10px 12px;
      cursor: pointer;
    }
    .hint-reward-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .hint-reward-panel {
      margin-top: 8px;
      padding: 10px 12px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--card-bg);
      font-size: 13px;
      color: var(--text-secondary);
      line-height: 1.5;
      text-align: left;
    }

    /* Multiple-choice grid */
    .choices-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      padding: 0 20px;
    }
    .choice-btn {
      background: var(--card-bg);
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      padding: clamp(12px, 1.8vh, 16px) 10px;
      font-size: 15px;
      font-weight: 600;
      color: var(--text-primary);
      cursor: pointer;
      text-align: center;
      transition: background 0.2s, border-color 0.2s, color 0.2s;
      min-height: clamp(52px, 8vh, 60px);
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1.3;
    }
    .choice-btn.correct {
      background: var(--correct-bg);
      border-color: var(--correct-text);
      color: var(--correct-text);
    }
    .choice-btn.wrong {
      background: var(--wrong-bg);
      border-color: var(--wrong-text);
      color: var(--wrong-text);
    }
    .choice-btn:disabled {
      cursor: default;
    }

    /* Feedback */
    .feedback-box {
      margin: 16px 20px 0;
      padding: 14px 16px;
      border-radius: var(--radius-sm);
      font-size: 14px;
      display: none;
      line-height: 1.6;
    }
    .feedback-box.show {
      display: block;
    }
    .feedback-box.correct {
      background: var(--correct-bg);
      color: var(--correct-text);
    }
    .feedback-box.wrong {
      background: var(--wrong-bg);
      color: var(--wrong-text);
    }
    .feedback-title {
      font-weight: 700;
      font-size: 15px;
      margin-bottom: 6px;
    }
    .streak-badge {
      margin: 0 20px 8px;
      text-align: center;
      font-size: 13px;
      font-weight: 600;
      color: var(--gold);
      min-height: 20px;
    }
    .next-btn-wrap {
      padding: 8px 20px 0;
      display: none;
    }
    .next-btn-wrap.show {
      display: block;
    }

    /* Expert-level hint card */
    .expert-usage-label {
      font-size: 11px;
      color: var(--text-muted);
      background: var(--bg);
      border-radius: 4px;
      padding: 2px 8px;
    }

    @media (max-height: 760px) {
      .top-bar {
        padding-top: 12px;
      }
      .progress-bar-wrap {
        padding-bottom: 10px;
      }
      .question-word {
        font-size: 26px;
      }
      .question-word.small {
        font-size: 20px;
      }
    }

    @media (min-width: 520px) {
      .question-word {
        font-size: 36px;
      }
      .question-word.small {
        font-size: 26px;
      }
      .choice-btn {
        font-size: 17px;
        min-height: 72px;
        padding: 18px 12px;
      }
      .top-bar,
      .progress-bar-wrap,
      .choices-grid {
        padding-left: 28px;
        padding-right: 28px;
      }
      .question-card {
        margin-left: 28px;
        margin-right: 28px;
        min-height: 160px;
      }
    }
  </style>
  <script src="./js/app.js?v=20260624-9"></script>
</head>
<body class="quiz-page">
  <header class="quiz-header">
    <div class="top-bar">
      <a class="back-btn" id="backBtn" href="index.html">←</a>
      <span class="level-badge" id="levelBadge"></span>
      <span class="progress-text" id="progressText">1 / 10</span>
    </div>

    <div class="progress-bar-wrap">
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="progressFill" style="width:0%"></div>
      </div>
    </div>
  </header>

  <main class="quiz-main">
    <div class="quiz-center">
      <div class="card question-card">
        <div class="question-level-tag" id="questionLevelTag"></div>
        <div class="question-type-label" id="questionTypeLabel"></div>
        <div class="question-word" id="questionWord"></div>
        <div class="question-hint" id="questionSubHint"></div>
      </div>

      <div class="hint-reward-wrap" id="hintRewardWrap">
        <button type="button" class="hint-reward-btn" id="hintRewardBtn">Watch ad for hint</button>
        <div class="hint-reward-panel" id="hintRewardPanel" style="display:none;"></div>
      </div>

      <div class="choices-grid" id="choicesGrid"></div>
    </div>

    <div class="quiz-bottom">
      <div class="streak-badge" id="streakBadge"></div>

      <div class="feedback-box" id="feedbackBox">
        <div class="feedback-title" id="feedbackTitle"></div>
        <div id="feedbackHint"></div>
      </div>

      <div class="next-btn-wrap" id="nextBtnWrap">
        <button class="btn-primary" id="nextBtn">Next →</button>
      </div>
    </div>
  </main>

  <script>
    (function bootQuizPage() {
      const WEB_VERSION =
        new URLSearchParams(window.location.search).get('v') || '20260624-10';

      function showQuizError(message) {
        const grid = document.getElementById('choicesGrid');
        if (grid) grid.style.display = 'none';
        const typeLabel = document.getElementById('questionTypeLabel');
        const wordEl = document.getElementById('questionWord');
        const subHint = document.getElementById('questionSubHint');
        if (typeLabel) typeLabel.textContent = 'Failed to load quiz';
        if (wordEl) {
          wordEl.textContent = message;
          wordEl.className = 'question-word small';
        }
        if (subHint) subHint.textContent = '';
        const fb = document.getElementById('feedbackBox');
        const title = document.getElementById('feedbackTitle');
        const hint = document.getElementById('feedbackHint');
        const nextWrap = document.getElementById('nextBtnWrap');
        if (fb) fb.className = 'feedback-box wrong show';
        if (title) title.textContent = 'Error';
        if (hint) hint.textContent = 'Word data is empty or failed to load.';
        if (nextWrap) nextWrap.className = 'next-btn-wrap';
      }

      if (typeof resolveStageLevel !== 'function') {
        showQuizError('App script failed to load.');
        return;
      }

    const urlParams = new URLSearchParams(location.search);
    const mode = (urlParams.get('mode') || 'random').toLowerCase();
    const level = resolveStageLevel();
    const QUESTIONS_PER_QUIZ = 10;
    let TOTAL = QUESTIONS_PER_QUIZ;
    document.getElementById('progressText').textContent = `1 / ${TOTAL}`;

    const levelIcons = {
      beginner: '🌱',
      intermediate: '🌿',
      advanced: '🌳',
      expert: '⭐',
    };
    const levelNames = {
      beginner: 'Beginner',
      intermediate: 'Intermediate',
      advanced: 'Advanced',
      expert: 'Expert',
    };

    const backUrl = new URL('index.html', location.href);
    backUrl.searchParams.set('v', WEB_VERSION);
    document.getElementById('backBtn').href = backUrl.toString();
    document.getElementById('levelBadge').textContent = 'All Levels';

    loadAllWordPools(WEB_VERSION)
      .then(poolsByLevel => {
        try {
          initQuiz(poolsByLevel);
        } catch (e) {
          showQuizError(e && e.message ? e.message : String(e));
        }
      })
      .catch(() => showQuizError('Failed to load word data.'));

    function setQuestionLevelTag(wordLevel) {
      const el = document.getElementById('questionLevelTag');
      if (!el) return;
      const label = levelNames[wordLevel] || wordLevel;
      el.textContent = `${levelIcons[wordLevel] || ''} ${label}`.trim();
    }

    function initQuiz(poolsByLevel) {
      const fullPool = [];
      STAGE_LEVELS.forEach(lv => {
        (poolsByLevel[lv] || []).forEach(word => {
          fullPool.push({ ...word, _level: lv });
        });
      });

      if (!fullPool.length) {
        showQuizError('No word data found.');
        return;
      }

      const questions = shuffle([...fullPool]).slice(0, QUESTIONS_PER_QUIZ);
      TOTAL = questions.length;
      if (!TOTAL) {
        showQuizError('Failed to load questions.');
        return;
      }

      trackEvent('quiz_started');
      const streakSummary = updatePlayStreak();

      let current = 0;
      let score = 0;
      let correctCount = 0;
      let streak = 0;

      function getWordLevel(word) {
        return word?._level || level;
      }

      let hintUnlockedForQuestion = false;
      let hintRewardInFlight = false;
      let currentHintQuestion = null;

      function hideHintRewardUI() {
        const wrap = document.getElementById('hintRewardWrap');
        if (wrap) wrap.style.display = 'none';
      }

      function resetHintRewardState() {
        hintUnlockedForQuestion = false;
        hintRewardInFlight = false;
        currentHintQuestion = null;
        const panel = document.getElementById('hintRewardPanel');
        const btn = document.getElementById('hintRewardBtn');
        if (panel) {
          panel.style.display = 'none';
          panel.textContent = '';
        }
        if (btn) {
          btn.style.display = 'block';
          btn.disabled = false;
          btn.textContent = 'Watch ad for hint';
        }
      }

      function applyAdvancedHint(q) {
        const panel = document.getElementById('hintRewardPanel');
        const btn = document.getElementById('hintRewardBtn');
        if (!panel || !q?.hint) return;
        panel.textContent = `💡 ${q.hint}`;
        panel.style.display = 'block';
        if (btn) btn.style.display = 'none';
      }

      function applyExpertHint(q) {
        const panel = document.getElementById('hintRewardPanel');
        const btn = document.getElementById('hintRewardBtn');
        if (!panel || !Array.isArray(q?.meanings)) return;
        panel.textContent =
          'Possible meanings: ' +
          q.meanings.map(m => `${m.emoji} ${m.english}`).join(' · ');
        panel.style.display = 'block';
        if (btn) btn.style.display = 'none';
      }

      function setupHintRewardUI(q, levelKey) {
        const wrap = document.getElementById('hintRewardWrap');
        const btn = document.getElementById('hintRewardBtn');
        if (!wrap || !btn) return;

        if (levelKey !== 'advanced' && levelKey !== 'expert') {
          hideHintRewardUI();
          return;
        }

        currentHintQuestion = q;
        wrap.style.display = 'block';
        btn.style.display = hintUnlockedForQuestion ? 'none' : 'block';
        btn.disabled = hintRewardInFlight;

        if (hintUnlockedForQuestion) {
          if (levelKey === 'advanced') applyAdvancedHint(q);
          else applyExpertHint(q);
        }
      }

      async function onHintRewardClick() {
        if (hintUnlockedForQuestion || hintRewardInFlight || !currentHintQuestion) return;

        const btn = document.getElementById('hintRewardBtn');
        hintRewardInFlight = true;
        if (btn) {
          btn.disabled = true;
          btn.textContent = 'Loading ad...';
        }

        const result = await requestRewardedHint();
        hintRewardInFlight = false;

        if (result.rewarded) {
          hintUnlockedForQuestion = true;
          if (level === 'advanced') applyAdvancedHint(currentHintQuestion);
          else if (level === 'expert') applyExpertHint(currentHintQuestion);
          trackEvent('hint_rewarded');
          return;
        }

        if (btn) {
          btn.disabled = false;
          btn.textContent = 'Watch ad for hint';
        }
        alert('Ad is not available right now. Please try again later.');
      }

      document.getElementById('hintRewardBtn').addEventListener('click', onHintRewardClick);

      function lockHintRewardAfterAnswer() {
        const btn = document.getElementById('hintRewardBtn');
        if (btn) btn.disabled = true;
      }

      function shuffle(arr) {
        for (let i = arr.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
      }

      function resetUI() {
        document.getElementById('progressText').textContent = `${current + 1} / ${TOTAL}`;
        document.getElementById('progressFill').style.width = `${(current / TOTAL) * 100}%`;
        document.getElementById('feedbackBox').className = 'feedback-box';
        document.getElementById('nextBtnWrap').className = 'next-btn-wrap';
        document.getElementById('streakBadge').textContent = '';
        document.getElementById('questionSubHint').textContent = '';
        resetHintRewardState();
      }

      function showNextBtn() {
        document.getElementById('nextBtnWrap').className = 'next-btn-wrap show';
      }

      function markWrongWord(word) {
        const wordLevel = getWordLevel(word);
        const wordId = getWordId(word);
        addReviewWord(wordLevel, wordId);
        removeLearnedWord(wordLevel, wordId);
      }

      function markCorrectWord(word) {
        const wordLevel = getWordLevel(word);
        const wordId = getWordId(word);
        addLearnedWord(wordLevel, wordId);
        removeReviewWord(wordLevel, wordId);
      }

      function applyStreak() {
        let bonus = 0;
        if (streak >= 5) bonus = 10;
        else if (streak >= 3) bonus = 5;
        score += 10 + bonus;
        correctCount++;
        const streakEl = document.getElementById('streakBadge');
        if (streak >= 5) streakEl.textContent = `🔥 ${streak} streak! +10 bonus`;
        else if (streak >= 3) streakEl.textContent = `🔥 ${streak} streak! +5 bonus`;
      }

      function renderQuestion() {
        resetUI();
        const q = questions[current];

        if (!q) {
          showQuizError('Please check your quiz data.');
          return;
        }

        const wordLevel = getWordLevel(q);
        setQuestionLevelTag(wordLevel);

        if (wordLevel === 'advanced') {
          renderAdvanced(q, wordLevel);
          setupHintRewardUI(q, 'advanced');
        } else if (wordLevel === 'expert') {
          renderExpert(q, wordLevel);
          setupHintRewardUI(q, 'expert');
        } else {
          hideHintRewardUI();
          renderMCQ(q, wordLevel);
        }
      }

      function renderMCQ(q, wordLevel) {
        document.getElementById('choicesGrid').style.display = '';
        const quizDir = supportsQuizDirection(wordLevel)
          ? getQuizDirection(wordLevel)
          : 'KO_EN';
        const levelPool = poolsByLevel[wordLevel] || [];

        if (quizDir === 'KO_EN') {
          document.getElementById('questionTypeLabel').textContent = 'What is the English meaning?';
          document.getElementById('questionWord').textContent = q.korean;
          document.getElementById('questionWord').className = 'question-word';
          buildChoices(q, 'english', levelPool);
        } else {
          document.getElementById('questionTypeLabel').textContent = 'What is the Korean word?';
          document.getElementById('questionWord').textContent = q.english;
          document.getElementById('questionWord').className = 'question-word';
          buildChoices(q, 'korean', levelPool);
        }
      }

      function buildChoices(q, field, allWords) {
        const correct = q[field];
        const others = shuffle(
          allWords.filter(w => w[field] !== correct).map(w => w[field])
        ).slice(0, 3);
        const options = shuffle([correct, ...others]);

        const feedbackText = q.example || q.hint || '';
        const feedbackLabel = q.example ? 'Example' : (q.hint ? 'Hint' : '');

        const grid = document.getElementById('choicesGrid');
        grid.innerHTML = '';
        options.forEach(opt => {
          const btn = document.createElement('button');
          btn.className = 'choice-btn';
          btn.textContent = opt;
          btn.addEventListener('click', () => {
            handleMCQChoice(btn, opt, correct, feedbackText, feedbackLabel, q);
          });
          grid.appendChild(btn);
        });
      }

      function handleMCQChoice(btn, selected, correct, feedbackText, feedbackLabel, q) {
        document.querySelectorAll('.choice-btn').forEach(b => {
          b.disabled = true;
          if (b.textContent === correct) b.classList.add('correct');
        });

        const fb = document.getElementById('feedbackBox');
        const title = document.getElementById('feedbackTitle');
        const hintEl = document.getElementById('feedbackHint');

        if (selected === correct) {
          btn.classList.add('correct');
          streak++;
          applyStreak();
          markCorrectWord(q);
          fb.className = 'feedback-box correct show';
          title.textContent = '✓ Correct!';
          hintEl.textContent = feedbackText ? `${feedbackLabel}: ${feedbackText}` : '';
        } else {
          btn.classList.add('wrong');
          streak = 0;
          markWrongWord(q);
          fb.className = 'feedback-box wrong show';
          title.textContent = '✗ Wrong!';
          hintEl.textContent = `Correct: ${correct}${feedbackText ? ' · ' + feedbackLabel + ': ' + feedbackText : ''}`;
        }
        showNextBtn();
      }

      function renderAdvanced(q, wordLevel) {
        document.getElementById('choicesGrid').style.display = '';
        document.getElementById('questionTypeLabel').textContent = 'Which word best fits the blank?';
        document.getElementById('questionWord').textContent = q.korean;
        document.getElementById('questionWord').className = 'question-word small';
        document.getElementById('questionSubHint').textContent = q.english;

        const levelPool = poolsByLevel[wordLevel] || [];
        const others = shuffle(
          levelPool.filter(w => w.answer !== q.answer).map(w => w.answer)
        ).slice(0, 3);
        const options = shuffle([q.answer, ...others]);

        const grid = document.getElementById('choicesGrid');
        grid.innerHTML = '';
        options.forEach(opt => {
          const btn = document.createElement('button');
          btn.className = 'choice-btn';
          btn.textContent = opt;
          btn.addEventListener('click', () => handleAdvancedChoice(btn, opt, q));
          grid.appendChild(btn);
        });
      }

      function handleAdvancedChoice(btn, selected, q) {
        lockHintRewardAfterAnswer();
        document.querySelectorAll('.choice-btn').forEach(b => {
          b.disabled = true;
          if (b.textContent === q.answer) b.classList.add('correct');
        });

        const fb = document.getElementById('feedbackBox');
        const title = document.getElementById('feedbackTitle');
        const hintEl = document.getElementById('feedbackHint');
        const fullSentence = q.korean.replace('___', `【${q.answer}】`);

        if (selected === q.answer) {
          btn.classList.add('correct');
          streak++;
          applyStreak();
          markCorrectWord(q);
          fb.className = 'feedback-box correct show';
          title.textContent = '✓ Correct!';
          hintEl.innerHTML = `<strong>${fullSentence}</strong><br><em>${q.english}</em><br>💡 ${q.hint}`;
        } else {
          btn.classList.add('wrong');
          streak = 0;
          markWrongWord(q);
          fb.className = 'feedback-box wrong show';
          title.textContent = '✗ Wrong!';
          hintEl.innerHTML = `<strong>${fullSentence}</strong><br><em>${q.english}</em><br>💡 ${q.hint}`;
        }
        showNextBtn();
      }

      function renderExpert(q, wordLevel) {
        document.getElementById('choicesGrid').style.display = '';
        document.getElementById('questionTypeLabel').textContent = 'What does this mean?';
        document.getElementById('questionWord').textContent = q.korean;
        document.getElementById('questionWord').className = 'question-word';

        const targetIdx = Math.floor(Math.random() * q.meanings.length);
        const target = q.meanings[targetIdx];

        document.getElementById('questionSubHint').innerHTML =
          `${target.emoji}&nbsp;&nbsp;<em>${target.example}</em>`;

        const levelPool = poolsByLevel[wordLevel] || [];
        const allEnglish = levelPool.flatMap(w => w.meanings.map(m => m.english));
        const others = shuffle(
          allEnglish.filter(e => e !== target.english)
        ).slice(0, 3);
        const options = shuffle([target.english, ...others]);

        const grid = document.getElementById('choicesGrid');
        grid.innerHTML = '';
        options.forEach(opt => {
          const btn = document.createElement('button');
          btn.className = 'choice-btn';
          btn.textContent = opt;
          btn.addEventListener('click', () => handleExpertChoice(btn, opt, q, target));
          grid.appendChild(btn);
        });
      }

      function handleExpertChoice(btn, selected, q, target) {
        lockHintRewardAfterAnswer();
        document.querySelectorAll('.choice-btn').forEach(b => {
          b.disabled = true;
          if (b.textContent === target.english) b.classList.add('correct');
        });

        const fb = document.getElementById('feedbackBox');
        const title = document.getElementById('feedbackTitle');
        const hintEl = document.getElementById('feedbackHint');

        const allMeaningsHtml = q.meanings
          .map(m => `${m.emoji} <strong>${m.english}</strong> — <em>${m.example}</em>`)
          .join('<br>');

        if (selected === target.english) {
          btn.classList.add('correct');
          streak++;
          applyStreak();
          markCorrectWord(q);
          fb.className = 'feedback-box correct show';
          title.textContent = '✓ Correct!';
          hintEl.innerHTML =
            `All meanings of <strong>'${q.korean}'</strong>:<br>${allMeaningsHtml}`;
        } else {
          btn.classList.add('wrong');
          streak = 0;
          markWrongWord(q);
          fb.className = 'feedback-box wrong show';
          title.textContent = '✗ Wrong!';
          hintEl.innerHTML =
            `Correct: <strong>${target.english}</strong><br>` +
            `All meanings of <strong>'${q.korean}'</strong>:<br>${allMeaningsHtml}`;
        }
        showNextBtn();
      }

      document.getElementById('nextBtn').addEventListener('click', () => {
        current++;
        if (current >= TOTAL) {
          const queryParams = {
            mode: 'random',
            score: String(score),
            correct: String(correctCount),
            totalQuestions: String(TOTAL),
            streakCurrent: String(streakSummary.current),
            v: WEB_VERSION,
          };
          location.href = `result.html?${new URLSearchParams(queryParams).toString()}`;
        } else {
          renderQuestion();
        }
      });

      renderQuestion();
    }
    })();
  </script>
</body>
</html>
