<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Quiz – Korean Word Quiz</title>
  <link rel="stylesheet" href="./css/base.css?v=20260528-1">
  <style>
    body.quiz-page {
      display: flex;
      flex-direction: column;
      height: 100%;
      min-height: 100dvh;
      max-width: 100%;
      padding-bottom: 0;
    }
    .quiz-header {
      flex-shrink: 0;
    }
    .quiz-main {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
      justify-content: space-between;
    }
    .quiz-center {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 14px;
      padding: 4px 0 12px;
    }
    .quiz-bottom {
      flex-shrink: 0;
      padding-bottom: 12px;
    }
    .top-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px 20px 8px;
    }
    .back-btn {
      background: none;
      border: none;
      font-size: 22px;
      color: var(--text-secondary);
      cursor: pointer;
      padding: 4px;
      flex-shrink: 0;
    }
    .level-badge {
      font-size: 13px;
      font-weight: 600;
      color: var(--gold);
      text-transform: capitalize;
      flex: 1;
    }
    .progress-text {
      font-size: 13px;
      color: var(--text-muted);
      font-weight: 600;
    }
    .progress-bar-wrap {
      padding: 0 20px 16px;
    }
    .progress-bar-bg {
      background: var(--card-bg);
      border-radius: 99px;
      height: 6px;
      overflow: hidden;
    }
    .progress-bar-fill {
      height: 100%;
      background: var(--gold);
      border-radius: 99px;
      transition: width 0.3s ease;
    }
    .question-card {
      margin: 0 20px;
      padding: 28px 20px;
      text-align: center;
      min-height: 140px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    .question-type-label {
      font-size: 12px;
      color: var(--text-muted);
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    .question-word {
      font-size: 30px;
      font-weight: 700;
      color: var(--text-primary);
      line-height: 1.3;
    }
    .question-word.small {
      font-size: 22px;
    }
    .question-hint {
      font-size: 13px;
      color: var(--text-muted);
      font-style: italic;
    }

    /* 4지선다 그리드 */
    .choices-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      padding: 0 20px;
    }
    .choice-btn {
      background: var(--card-bg);
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 16px 10px;
      font-size: 15px;
      font-weight: 600;
      color: var(--text-primary);
      cursor: pointer;
      text-align: center;
      transition: background 0.2s, border-color 0.2s, color 0.2s;
      min-height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1.3;
    }
    .choice-btn.correct {
      background: var(--correct-bg);
      border-color: var(--correct-text);
      color: var(--correct-text);
    }
    .choice-btn.wrong {
      background: var(--wrong-bg);
      border-color: var(--wrong-text);
      color: var(--wrong-text);
    }
    .choice-btn:disabled {
      cursor: default;
    }

    /* 피드백 */
    .feedback-box {
      margin: 16px 20px 0;
      padding: 14px 16px;
      border-radius: var(--radius-sm);
      font-size: 14px;
      display: none;
      line-height: 1.6;
    }
    .feedback-box.show {
      display: block;
    }
    .feedback-box.correct {
      background: var(--correct-bg);
      color: var(--correct-text);
    }
    .feedback-box.wrong {
      background: var(--wrong-bg);
      color: var(--wrong-text);
    }
    .feedback-title {
      font-weight: 700;
      font-size: 15px;
      margin-bottom: 6px;
    }
    .streak-badge {
      margin: 0 20px 8px;
      text-align: center;
      font-size: 13px;
      font-weight: 600;
      color: var(--gold);
      min-height: 20px;
    }
    .next-btn-wrap {
      padding: 8px 20px 0;
      display: none;
    }
    .next-btn-wrap.show {
      display: block;
    }

    /* expert 레벨: 단어 설명 카드 */
    .expert-usage-label {
      font-size: 11px;
      color: var(--text-muted);
      background: var(--bg);
      border-radius: 4px;
      padding: 2px 8px;
    }

    /* 방향 선택 토글 (입문·중급 전용) */
    .dir-toggle-wrap {
      display: flex;
      gap: 8px;
      padding: 0 20px 14px;
    }
    .dir-btn {
      flex: 1;
      padding: 9px 8px;
      font-size: 13px;
      font-weight: 600;
      border-radius: var(--radius-sm);
      border: 1.5px solid var(--border);
      background: var(--card-bg);
      color: var(--text-muted);
      cursor: pointer;
      transition: background 0.18s, border-color 0.18s, color 0.18s;
      text-align: center;
      line-height: 1.3;
    }
    .dir-btn.active {
      background: var(--gold);
      border-color: var(--gold);
      color: #fff;
    }

    @media (min-width: 520px) {
      .question-word {
        font-size: 36px;
      }
      .question-word.small {
        font-size: 26px;
      }
      .choice-btn {
        font-size: 17px;
        min-height: 72px;
        padding: 18px 12px;
      }
      .dir-btn {
        font-size: 15px;
        padding: 12px 10px;
      }
      .top-bar,
      .progress-bar-wrap,
      .choices-grid,
      .dir-toggle-wrap {
        padding-left: 28px;
        padding-right: 28px;
      }
      .question-card {
        margin-left: 28px;
        margin-right: 28px;
        min-height: 160px;
      }
    }
  </style>
  <script src="./js/app.js?v=20260528-1"></script>
</head>
<body class="quiz-page">
  <header class="quiz-header">
    <div class="top-bar">
      <a class="back-btn" id="backBtn" href="index.html">←</a>
      <span class="level-badge" id="levelBadge"></span>
      <span class="progress-text" id="progressText">1 / 10</span>
    </div>

    <div class="progress-bar-wrap">
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="progressFill" style="width:0%"></div>
      </div>
    </div>
  </header>

  <main class="quiz-main">
    <div class="quiz-center">
      <div class="dir-toggle-wrap" id="dirToggleWrap" style="display:none;">
        <button class="dir-btn active" id="dirBtnKO">한글 → 영어</button>
        <button class="dir-btn" id="dirBtnEN">영어 → 한글</button>
      </div>

      <div class="card question-card">
        <div class="question-type-label" id="questionTypeLabel"></div>
        <div class="question-word" id="questionWord"></div>
        <div class="question-hint" id="questionSubHint"></div>
      </div>

      <div class="choices-grid" id="choicesGrid"></div>
    </div>

    <div class="quiz-bottom">
      <div class="streak-badge" id="streakBadge"></div>

      <div class="feedback-box" id="feedbackBox">
        <div class="feedback-title" id="feedbackTitle"></div>
        <div id="feedbackHint"></div>
      </div>

      <div class="next-btn-wrap" id="nextBtnWrap">
        <button class="btn-primary" id="nextBtn">Next →</button>
      </div>
    </div>
  </main>

  <script>
    const WEB_VERSION =
      new URLSearchParams(window.location.search).get('v') || '20260528-1';
    const urlParams = new URLSearchParams(location.search);
    const requestedLevel = urlParams.get('level') || 'beginner';
    const supportedLevels = ['beginner', 'intermediate', 'advanced', 'expert'];
    const level = supportedLevels.includes(requestedLevel)
      ? requestedLevel
      : 'beginner';
    const QUESTIONS_PER_STAGE = 10;
    const wordCounts = {
      beginner: 50,
      intermediate: 30,
      advanced: 30,
      expert: 20,
    };
    const totalStages = Math.ceil((wordCounts[level] || 30) / QUESTIONS_PER_STAGE);
    let stage = parseInt(urlParams.get('stage') || '1', 10);
    if (!Number.isFinite(stage) || stage < 1) stage = 1;
    if (stage > totalStages) stage = totalStages;
    const TOTAL = QUESTIONS_PER_STAGE;

    const levelIcons = {
      beginner: '🌱',
      intermediate: '🌿',
      advanced: '🌳',
      expert: '⭐',
    };
    const levelNames = {
      beginner: '입문',
      intermediate: '중급',
      advanced: '고급',
      expert: '특급',
    };

    const backUrl = new URL('stages.html', location.href);
    backUrl.searchParams.set('level', level);
    backUrl.searchParams.set('v', WEB_VERSION);
    document.getElementById('backBtn').href = backUrl.toString();
    document.getElementById('levelBadge').textContent =
      `${levelIcons[level] || ''} ${levelNames[level] || level} · Stage ${stage}`.trim();

    function showQuizError(message) {
      document.getElementById('choicesGrid').style.display = 'none';
      document.getElementById('questionTypeLabel').textContent =
        '문제를 불러오지 못했습니다';
      document.getElementById('questionWord').textContent = message;
      document.getElementById('questionWord').className = 'question-word small';
      document.getElementById('questionSubHint').textContent = '';
      document.getElementById('feedbackBox').className = 'feedback-box wrong show';
      document.getElementById('feedbackTitle').textContent = '오류';
      document.getElementById('feedbackHint').textContent =
        '단어 데이터가 비어 있거나 로드되지 않았습니다.';
      document.getElementById('nextBtnWrap').className = 'next-btn-wrap';
    }

    const script = document.createElement('script');
    script.src = `js/word-data-${level}.js?v=${encodeURIComponent(WEB_VERSION)}`;
    script.onload = () => initQuiz();
    script.onerror = () => showQuizError('레벨 데이터 파일을 불러오지 못했습니다.');
    document.head.appendChild(script);

    function initQuiz() {
      const wordData = typeof WordData !== 'undefined' ? WordData : {};
      const pool = [...(wordData[level] || [])];

      if (!pool.length) {
        showQuizError('선택한 레벨의 데이터가 없습니다.');
        return;
      }

      const startIdx = (stage - 1) * QUESTIONS_PER_STAGE;
      const stageWords = pool.slice(startIdx, startIdx + QUESTIONS_PER_STAGE);
      if (stageWords.length < TOTAL) {
        showQuizError('이 스테이지에 문제가 충분하지 않습니다.');
        return;
      }
      const questions = shuffle([...stageWords]);

      let current = 0;
      let score = 0;
      let correctCount = 0;
      let streak = 0;

      // 방향 선택 (입문·중급 전용): 'KO_EN' | 'EN_KO'
      // 레벨별로 별도 키를 사용해 독립적으로 저장·복원
      const dirKey = `quizDir_${level}`;
      let quizDir = localStorage.getItem(dirKey) || 'KO_EN';

      if (level === 'beginner' || level === 'intermediate') {
        const wrap = document.getElementById('dirToggleWrap');
        const btnKO = document.getElementById('dirBtnKO');
        const btnEN = document.getElementById('dirBtnEN');
        wrap.style.display = '';

        function applyDirUI() {
          btnKO.classList.toggle('active', quizDir === 'KO_EN');
          btnEN.classList.toggle('active', quizDir === 'EN_KO');
        }
        // 복원된 설정을 버튼 UI에 즉시 반영
        applyDirUI();

        function setDir(dir) {
          quizDir = dir;
          localStorage.setItem(dirKey, dir);
          applyDirUI();
          // 현재 문제를 새 방향으로 즉시 재렌더링
          renderQuestion();
        }
        btnKO.addEventListener('click', () => setDir('KO_EN'));
        btnEN.addEventListener('click', () => setDir('EN_KO'));
      }

      function shuffle(arr) {
        for (let i = arr.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
      }

      function resetUI() {
        document.getElementById('progressText').textContent = `${current + 1} / ${TOTAL}`;
        document.getElementById('progressFill').style.width = `${(current / TOTAL) * 100}%`;
        document.getElementById('feedbackBox').className = 'feedback-box';
        document.getElementById('nextBtnWrap').className = 'next-btn-wrap';
        document.getElementById('streakBadge').textContent = '';
        document.getElementById('questionSubHint').textContent = '';
      }

      function showNextBtn() {
        document.getElementById('nextBtnWrap').className = 'next-btn-wrap show';
      }

      function applyStreak() {
        let bonus = 0;
        if (streak >= 5) bonus = 10;
        else if (streak >= 3) bonus = 5;
        score += 10 + bonus;
        correctCount++;
        const streakEl = document.getElementById('streakBadge');
        if (streak >= 5) streakEl.textContent = `🔥 ${streak} streak! +10 bonus`;
        else if (streak >= 3) streakEl.textContent = `🔥 ${streak} streak! +5 bonus`;
      }

      function renderQuestion() {
        resetUI();
        const q = questions[current];

        if (!q) {
          showQuizError('데이터를 다시 확인해주세요.');
          return;
        }

        if (level === 'advanced') {
          renderAdvanced(q);
        } else if (level === 'expert') {
          renderExpert(q);
        } else {
          renderMCQ(q);
        }
      }

      function renderMCQ(q) {
        document.getElementById('choicesGrid').style.display = '';

        if (quizDir === 'KO_EN') {
          document.getElementById('questionTypeLabel').textContent = 'What is the English meaning?';
          document.getElementById('questionWord').textContent = q.korean;
          document.getElementById('questionWord').className = 'question-word';
          buildChoices(q, 'english', pool);
        } else {
          document.getElementById('questionTypeLabel').textContent = 'What is the Korean word?';
          document.getElementById('questionWord').textContent = q.english;
          document.getElementById('questionWord').className = 'question-word';
          buildChoices(q, 'korean', pool);
        }
      }

      function buildChoices(q, field, allWords) {
        const correct = q[field];
        const others = shuffle(
          allWords.filter(w => w[field] !== correct).map(w => w[field])
        ).slice(0, 3);
        const options = shuffle([correct, ...others]);

        const feedbackText = q.example || q.hint || '';
        const feedbackLabel = q.example ? 'Example' : (q.hint ? 'Hint' : '');

        const grid = document.getElementById('choicesGrid');
        grid.innerHTML = '';
        options.forEach(opt => {
          const btn = document.createElement('button');
          btn.className = 'choice-btn';
          btn.textContent = opt;
          btn.addEventListener('click', () => {
            handleMCQChoice(btn, opt, correct, feedbackText, feedbackLabel);
          });
          grid.appendChild(btn);
        });
      }

      function handleMCQChoice(btn, selected, correct, feedbackText, feedbackLabel) {
        document.querySelectorAll('.choice-btn').forEach(b => {
          b.disabled = true;
          if (b.textContent === correct) b.classList.add('correct');
        });

        const fb = document.getElementById('feedbackBox');
        const title = document.getElementById('feedbackTitle');
        const hintEl = document.getElementById('feedbackHint');

        if (selected === correct) {
          btn.classList.add('correct');
          streak++;
          applyStreak();
          fb.className = 'feedback-box correct show';
          title.textContent = '✓ Correct!';
          hintEl.textContent = feedbackText ? `${feedbackLabel}: ${feedbackText}` : '';
        } else {
          btn.classList.add('wrong');
          streak = 0;
          fb.className = 'feedback-box wrong show';
          title.textContent = '✗ Wrong!';
          hintEl.textContent = `Correct: ${correct}${feedbackText ? ' · ' + feedbackLabel + ': ' + feedbackText : ''}`;
        }
        showNextBtn();
      }

      function renderAdvanced(q) {
        document.getElementById('choicesGrid').style.display = '';
        document.getElementById('questionTypeLabel').textContent = '빈칸에 알맞은 말은?';
        document.getElementById('questionWord').textContent = q.korean;
        document.getElementById('questionWord').className = 'question-word small';
        document.getElementById('questionSubHint').textContent = q.english;

        const others = shuffle(
          pool.filter(w => w.answer !== q.answer).map(w => w.answer)
        ).slice(0, 3);
        const options = shuffle([q.answer, ...others]);

        const grid = document.getElementById('choicesGrid');
        grid.innerHTML = '';
        options.forEach(opt => {
          const btn = document.createElement('button');
          btn.className = 'choice-btn';
          btn.textContent = opt;
          btn.addEventListener('click', () => handleAdvancedChoice(btn, opt, q));
          grid.appendChild(btn);
        });
      }

      function handleAdvancedChoice(btn, selected, q) {
        document.querySelectorAll('.choice-btn').forEach(b => {
          b.disabled = true;
          if (b.textContent === q.answer) b.classList.add('correct');
        });

        const fb = document.getElementById('feedbackBox');
        const title = document.getElementById('feedbackTitle');
        const hintEl = document.getElementById('feedbackHint');
        const fullSentence = q.korean.replace('___', `【${q.answer}】`);

        if (selected === q.answer) {
          btn.classList.add('correct');
          streak++;
          applyStreak();
          fb.className = 'feedback-box correct show';
          title.textContent = '✓ Correct!';
          hintEl.innerHTML = `<strong>${fullSentence}</strong><br><em>${q.english}</em><br>💡 ${q.hint}`;
        } else {
          btn.classList.add('wrong');
          streak = 0;
          fb.className = 'feedback-box wrong show';
          title.textContent = '✗ Wrong!';
          hintEl.innerHTML = `<strong>${fullSentence}</strong><br><em>${q.english}</em><br>💡 ${q.hint}`;
        }
        showNextBtn();
      }

      function renderExpert(q) {
        document.getElementById('choicesGrid').style.display = '';
        document.getElementById('questionTypeLabel').textContent = 'What does this mean?';
        document.getElementById('questionWord').textContent = q.korean;
        document.getElementById('questionWord').className = 'question-word';

        // Pick one random meaning to quiz on
        const targetIdx = Math.floor(Math.random() * q.meanings.length);
        const target = q.meanings[targetIdx];

        document.getElementById('questionSubHint').innerHTML =
          `${target.emoji}&nbsp;&nbsp;<em>${target.example}</em>`;

        // Collect wrong options from all other meanings in the pool
        const allEnglish = pool.flatMap(w => w.meanings.map(m => m.english));
        const others = shuffle(
          allEnglish.filter(e => e !== target.english)
        ).slice(0, 3);
        const options = shuffle([target.english, ...others]);

        const grid = document.getElementById('choicesGrid');
        grid.innerHTML = '';
        options.forEach(opt => {
          const btn = document.createElement('button');
          btn.className = 'choice-btn';
          btn.textContent = opt;
          btn.addEventListener('click', () => handleExpertChoice(btn, opt, q, target));
          grid.appendChild(btn);
        });
      }

      function handleExpertChoice(btn, selected, q, target) {
        document.querySelectorAll('.choice-btn').forEach(b => {
          b.disabled = true;
          if (b.textContent === target.english) b.classList.add('correct');
        });

        const fb = document.getElementById('feedbackBox');
        const title = document.getElementById('feedbackTitle');
        const hintEl = document.getElementById('feedbackHint');

        const allMeaningsHtml = q.meanings
          .map(m => `${m.emoji} <strong>${m.english}</strong> — <em>${m.example}</em>`)
          .join('<br>');

        if (selected === target.english) {
          btn.classList.add('correct');
          streak++;
          applyStreak();
          fb.className = 'feedback-box correct show';
          title.textContent = '✓ Correct!';
          hintEl.innerHTML =
            `All meanings of <strong>'${q.korean}'</strong>:<br>${allMeaningsHtml}`;
        } else {
          btn.classList.add('wrong');
          streak = 0;
          fb.className = 'feedback-box wrong show';
          title.textContent = '✗ Wrong!';
          hintEl.innerHTML =
            `Correct: <strong>${target.english}</strong><br>` +
            `All meanings of <strong>'${q.korean}'</strong>:<br>${allMeaningsHtml}`;
        }
        showNextBtn();
      }

      document.getElementById('nextBtn').addEventListener('click', () => {
        current++;
        if (current >= TOTAL) {
          const query = new URLSearchParams({
            level,
            stage: String(stage),
            score: String(score),
            correct: String(correctCount),
            totalStages: String(totalStages),
            v: WEB_VERSION,
          }).toString();
          location.href = `result.html?${query}`;
        } else {
          renderQuestion();
        }
      });

      renderQuestion();
    }
  </script>
</body>
</html>
