<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Quiz – Korean Word Quiz</title>
  <link rel="stylesheet" href="./css/base.css?v=20260603-2">
  <style>
    body.quiz-page {
      display: flex;
      flex-direction: column;
      height: 100%;
      min-height: 100dvh;
      max-width: 100%;
      padding-bottom: 0;
    }
    .quiz-header {
      flex-shrink: 0;
    }
    .quiz-main {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
      justify-content: flex-start;
    }
    .quiz-center {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      gap: clamp(8px, 1.6vh, 14px);
      padding: clamp(2px, 1vh, 10px) 0 10px;
    }
    .quiz-bottom {
      flex-shrink: 0;
      margin-top: auto;
      padding-bottom: 12px;
    }
    .top-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px 20px 8px;
    }
    .back-btn {
      background: none;
      border: none;
      font-size: 22px;
      color: var(--text-secondary);
      cursor: pointer;
      padding: 4px;
      flex-shrink: 0;
    }
    .level-badge {
      font-size: 13px;
      font-weight: 600;
      color: var(--gold);
      text-transform: capitalize;
      flex: 1;
    }
    .progress-text {
      font-size: 13px;
      color: var(--text-muted);
      font-weight: 600;
    }
    .progress-bar-wrap {
      padding: 0 20px 16px;
    }
    .progress-bar-bg {
      background: var(--card-bg);
      border-radius: 99px;
      height: 6px;
      overflow: hidden;
    }
    .progress-bar-fill {
      height: 100%;
      background: var(--gold);
      border-radius: 99px;
      transition: width 0.3s ease;
    }
    .question-card {
      margin: 0 20px;
      padding: clamp(18px, 3vh, 28px) 20px;
      text-align: center;
      min-height: clamp(110px, 19vh, 140px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    .question-type-label {
      font-size: 12px;
      color: var(--text-muted);
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    .question-word {
      font-size: 30px;
      font-weight: 700;
      color: var(--text-primary);
      line-height: 1.3;
    }
    .question-word.small {
      font-size: 22px;
    }
    .question-hint {
      font-size: 13px;
      color: var(--text-muted);
      font-style: italic;
    }
    .hint-reward-wrap {
      margin: 0 20px;
      display: none;
    }
    .hint-reward-btn {
      width: 100%;
      border: 1.5px dashed var(--gold);
      border-radius: var(--radius-sm);
      background: transparent;
      color: var(--gold);
      font-size: 13px;
      font-weight: 600;
      padding: 10px 12px;
      cursor: pointer;
    }
    .hint-reward-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .hint-reward-panel {
      margin-top: 8px;
      padding: 10px 12px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--card-bg);
      font-size: 13px;
      color: var(--text-secondary);
      line-height: 1.5;
      text-align: left;
    }

    /* Multiple-choice grid */
    .choices-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      padding: 0 20px;
    }
    .choice-btn {
      background: var(--card-bg);
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      padding: clamp(12px, 1.8vh, 16px) 10px;
      font-size: 15px;
      font-weight: 600;
      color: var(--text-primary);
      cursor: pointer;
      text-align: center;
      transition: background 0.2s, border-color 0.2s, color 0.2s;
      min-height: clamp(52px, 8vh, 60px);
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1.3;
    }
    .choice-btn.correct {
      background: var(--correct-bg);
      border-color: var(--correct-text);
      color: var(--correct-text);
    }
    .choice-btn.wrong {
      background: var(--wrong-bg);
      border-color: var(--wrong-text);
      color: var(--wrong-text);
    }
    .choice-btn:disabled {
      cursor: default;
    }

    /* Feedback */
    .feedback-box {
      margin: 16px 20px 0;
      padding: 14px 16px;
      border-radius: var(--radius-sm);
      font-size: 14px;
      display: none;
      line-height: 1.6;
    }
    .feedback-box.show {
      display: block;
    }
    .feedback-box.correct {
      background: var(--correct-bg);
      color: var(--correct-text);
    }
    .feedback-box.wrong {
      background: var(--wrong-bg);
      color: var(--wrong-text);
    }
    .feedback-title {
      font-weight: 700;
      font-size: 15px;
      margin-bottom: 6px;
    }
    .streak-badge {
      margin: 0 20px 8px;
      text-align: center;
      font-size: 13px;
      font-weight: 600;
      color: var(--gold);
      min-height: 20px;
    }
    .next-btn-wrap {
      padding: 8px 20px 0;
      display: none;
    }
    .next-btn-wrap.show {
      display: block;
    }

    /* Expert-level hint card */
    .expert-usage-label {
      font-size: 11px;
      color: var(--text-muted);
      background: var(--bg);
      border-radius: 4px;
      padding: 2px 8px;
    }

    @media (max-height: 760px) {
      .top-bar {
        padding-top: 12px;
      }
      .progress-bar-wrap {
        padding-bottom: 10px;
      }
      .question-word {
        font-size: 26px;
      }
      .question-word.small {
        font-size: 20px;
      }
    }

    @media (min-width: 520px) {
      .question-word {
        font-size: 36px;
      }
      .question-word.small {
        font-size: 26px;
      }
      .choice-btn {
        font-size: 17px;
        min-height: 72px;
        padding: 18px 12px;
      }
      .top-bar,
      .progress-bar-wrap,
      .choices-grid {
        padding-left: 28px;
        padding-right: 28px;
      }
      .question-card {
        margin-left: 28px;
        margin-right: 28px;
        min-height: 160px;
      }
    }
  </style>
  <script src="./js/app.js?v=20260603-5"></script>
</head>
<body class="quiz-page">
  <header class="quiz-header">
    <div class="top-bar">
      <a class="back-btn" id="backBtn" href="index.html">←</a>
      <span class="level-badge" id="levelBadge"></span>
      <span class="progress-text" id="progressText">1 / 10</span>
    </div>

    <div class="progress-bar-wrap">
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="progressFill" style="width:0%"></div>
      </div>
    </div>
  </header>

  <main class="quiz-main">
    <div class="quiz-center">
      <div class="card question-card">
        <div class="question-type-label" id="questionTypeLabel"></div>
        <div class="question-word" id="questionWord"></div>
        <div class="question-hint" id="questionSubHint"></div>
      </div>

      <div class="hint-reward-wrap" id="hintRewardWrap">
        <button type="button" class="hint-reward-btn" id="hintRewardBtn">Watch ad for hint</button>
        <div class="hint-reward-panel" id="hintRewardPanel" style="display:none;"></div>
      </div>

      <div class="choices-grid" id="choicesGrid"></div>
    </div>

    <div class="quiz-bottom">
      <div class="streak-badge" id="streakBadge"></div>

      <div class="feedback-box" id="feedbackBox">
        <div class="feedback-title" id="feedbackTitle"></div>
        <div id="feedbackHint"></div>
      </div>

      <div class="next-btn-wrap" id="nextBtnWrap">
        <button class="btn-primary" id="nextBtn">Next →</button>
      </div>
    </div>
  </main>

  <script>
    const WEB_VERSION =
      new URLSearchParams(window.location.search).get('v') || '20260603-5';
    const urlParams = new URLSearchParams(location.search);
    const requestedLevel = urlParams.get('level') || resolveStageLevel();
    const requestedMode = (urlParams.get('mode') || 'stage').toLowerCase();
    const dailyFlag = urlParams.get('daily') === '1';
    const source = urlParams.get('source') || '';
    const countParam = urlParams.get('count') || '';
    const forceDailyFlag = sessionStorage.getItem('force_daily_quiz') === '1';
    let mode = requestedMode;
    if (
      forceDailyFlag ||
      dailyFlag ||
      requestedMode === 'daily' ||
      (source === 'home' && countParam === String(DAILY_QUESTION_COUNT) && !urlParams.has('stage')) ||
      (countParam === String(DAILY_QUESTION_COUNT) && !urlParams.has('stage')) ||
      (countParam === '3' && !urlParams.has('stage'))
    ) {
      mode = 'daily';
      sessionStorage.removeItem('force_daily_quiz');
    }
    const requestedCount = parseInt(urlParams.get('count') || '0', 10);
    const level = normalizeStageLevel(requestedLevel) || 'beginner';
    if (mode !== 'daily') {
      rememberStageLevel(level);
    }
    const QUESTIONS_PER_STAGE = 10;
    const wordCounts = {
      beginner: 300,
      intermediate: 300,
      advanced: 300,
      expert: 160,
    };
    const totalStages = Math.ceil((wordCounts[level] || 30) / QUESTIONS_PER_STAGE);
    let stage = parseInt(urlParams.get('stage') || '1', 10);
    if (!Number.isFinite(stage) || stage < 1) stage = 1;
    if (stage > totalStages) stage = totalStages;
    let TOTAL = QUESTIONS_PER_STAGE;
    if (mode === 'daily') TOTAL = DAILY_QUESTION_COUNT;
    else if (mode === 'review' && Number.isFinite(requestedCount) && requestedCount > 0) {
      TOTAL = Math.min(10, requestedCount);
    }
    document.getElementById('progressText').textContent = `1 / ${TOTAL}`;

    const levelIcons = {
      beginner: '🌱',
      intermediate: '🌿',
      advanced: '🌳',
      expert: '⭐',
    };
    const levelNames = {
      beginner: 'Beginner',
      intermediate: 'Intermediate',
      advanced: 'Advanced',
      expert: 'Expert',
    };

    const backTarget = mode === 'daily' ? 'index.html' : 'stages.html';
    const backUrl = new URL(backTarget, location.href);
    if (mode !== 'daily') {
      backUrl.searchParams.set('level', level);
    }
    backUrl.searchParams.set('v', WEB_VERSION);
    document.getElementById('backBtn').href = backUrl.toString();
    const modeLabel =
      mode === 'review' ? 'Review' : mode === 'daily' ? `Daily ${DAILY_QUESTION_COUNT}` : `Stage ${stage}`;
    document.getElementById('levelBadge').textContent =
      `${levelIcons[level] || ''} ${levelNames[level] || level} · ${modeLabel}`.trim();

    function showQuizError(message) {
      document.getElementById('choicesGrid').style.display = 'none';
      document.getElementById('questionTypeLabel').textContent =
        'Failed to load quiz';
      document.getElementById('questionWord').textContent = message;
      document.getElementById('questionWord').className = 'question-word small';
      document.getElementById('questionSubHint').textContent = '';
      document.getElementById('feedbackBox').className = 'feedback-box wrong show';
      document.getElementById('feedbackTitle').textContent = 'Error';
      document.getElementById('feedbackHint').textContent =
        'Word data is empty or failed to load.';
      document.getElementById('nextBtnWrap').className = 'next-btn-wrap';
    }

    const script = document.createElement('script');
    script.src = `js/word-data-${level}.js?v=${encodeURIComponent(WEB_VERSION)}`;
    script.onload = () => initQuiz();
    script.onerror = () => showQuizError('Failed to load level data file.');
    document.head.appendChild(script);

    function initQuiz() {
      const wordData = typeof WordData !== 'undefined' ? WordData : {};
      const pool = [...(wordData[level] || [])];

      if (!pool.length) {
        showQuizError('No data found for this level.');
        return;
      }

      function getWordId(word) {
        if (!word || typeof word !== 'object') return '';
        if (word.korean && word.english) return `${word.korean}__${word.english}`;
        if (word.korean && word.answer) return `${word.korean}__${word.answer}`;
        if (word.korean && Array.isArray(word.meanings)) return `${word.korean}__expert`;
        return JSON.stringify(word);
      }

      function getDailyWords() {
        return [...pool];
      }

      function getDailyFixedWords() {
        const dailyPool = getDailyWords();
        const maxDailyCount = Math.min(TOTAL, dailyPool.length);
        if (!maxDailyCount) return [];

        const todayKey = getLocalDateKey();
        const storageKey = `daily_word_ids_${level}_${todayKey}`;
        const savedIds = getJsonStorage(storageKey, []);
        const byId = new Map(dailyPool.map(word => [getWordId(word), word]));

        if (Array.isArray(savedIds) && savedIds.length) {
          const savedWords = savedIds
            .map(id => byId.get(id))
            .filter(Boolean)
            .slice(0, maxDailyCount);
          if (savedWords.length === maxDailyCount) return savedWords;
        }

        const selectedWords = shuffle([...dailyPool]).slice(0, maxDailyCount);
        setJsonStorage(storageKey, selectedWords.map(getWordId));
        return selectedWords;
      }

      let sourceWords = [];
      if (mode === 'review') {
        const reviewSet = new Set(getReviewWordIds(level));
        sourceWords = pool.filter(w => reviewSet.has(getWordId(w)));
      } else if (mode === 'daily') {
        sourceWords = getDailyFixedWords();
      } else {
        const startIdx = (stage - 1) * QUESTIONS_PER_STAGE;
        sourceWords = pool.slice(startIdx, startIdx + QUESTIONS_PER_STAGE);
      }

      if (!sourceWords.length) {
        if (mode === 'review') {
          showQuizError('No review items found.');
        } else {
          showQuizError('Not enough questions to start this mode.');
        }
        return;
      }

      const preparedWords = mode === 'daily' ? [...sourceWords] : shuffle([...sourceWords]);
      const questions = preparedWords.slice(0, Math.min(TOTAL, sourceWords.length));
      TOTAL = questions.length;
      if (!TOTAL) {
        showQuizError('Failed to load questions.');
        return;
      }

      trackEvent('quiz_started');
      const streakSummary = updatePlayStreak();

      let current = 0;
      let score = 0;
      let correctCount = 0;
      let streak = 0;

      const quizDir = supportsQuizDirection(level) ? getQuizDirection(level) : 'KO_EN';

      let hintUnlockedForQuestion = false;
      let hintRewardInFlight = false;
      let currentHintQuestion = null;

      function hideHintRewardUI() {
        const wrap = document.getElementById('hintRewardWrap');
        if (wrap) wrap.style.display = 'none';
      }

      function resetHintRewardState() {
        hintUnlockedForQuestion = false;
        hintRewardInFlight = false;
        currentHintQuestion = null;
        const panel = document.getElementById('hintRewardPanel');
        const btn = document.getElementById('hintRewardBtn');
        if (panel) {
          panel.style.display = 'none';
          panel.textContent = '';
        }
        if (btn) {
          btn.style.display = 'block';
          btn.disabled = false;
          btn.textContent = 'Watch ad for hint';
        }
      }

      function applyAdvancedHint(q) {
        const panel = document.getElementById('hintRewardPanel');
        const btn = document.getElementById('hintRewardBtn');
        if (!panel || !q?.hint) return;
        panel.textContent = `💡 ${q.hint}`;
        panel.style.display = 'block';
        if (btn) btn.style.display = 'none';
      }

      function applyExpertHint(q) {
        const panel = document.getElementById('hintRewardPanel');
        const btn = document.getElementById('hintRewardBtn');
        if (!panel || !Array.isArray(q?.meanings)) return;
        panel.textContent =
          'Possible meanings: ' +
          q.meanings.map(m => `${m.emoji} ${m.english}`).join(' · ');
        panel.style.display = 'block';
        if (btn) btn.style.display = 'none';
      }

      function setupHintRewardUI(q, levelKey) {
        const wrap = document.getElementById('hintRewardWrap');
        const btn = document.getElementById('hintRewardBtn');
        if (!wrap || !btn) return;

        if (levelKey !== 'advanced' && levelKey !== 'expert') {
          hideHintRewardUI();
          return;
        }

        currentHintQuestion = q;
        wrap.style.display = 'block';
        btn.style.display = hintUnlockedForQuestion ? 'none' : 'block';
        btn.disabled = hintRewardInFlight;

        if (hintUnlockedForQuestion) {
          if (levelKey === 'advanced') applyAdvancedHint(q);
          else applyExpertHint(q);
        }
      }

      async function onHintRewardClick() {
        if (hintUnlockedForQuestion || hintRewardInFlight || !currentHintQuestion) return;

        const btn = document.getElementById('hintRewardBtn');
        hintRewardInFlight = true;
        if (btn) {
          btn.disabled = true;
          btn.textContent = 'Loading ad...';
        }

        const result = await requestRewardedHint();
        hintRewardInFlight = false;

        if (result.rewarded) {
          hintUnlockedForQuestion = true;
          if (level === 'advanced') applyAdvancedHint(currentHintQuestion);
          else if (level === 'expert') applyExpertHint(currentHintQuestion);
          trackEvent('hint_rewarded');
          return;
        }

        if (btn) {
          btn.disabled = false;
          btn.textContent = 'Watch ad for hint';
        }
        alert('Ad is not available right now. Please try again later.');
      }

      document.getElementById('hintRewardBtn').addEventListener('click', onHintRewardClick);

      function lockHintRewardAfterAnswer() {
        const btn = document.getElementById('hintRewardBtn');
        if (btn) btn.disabled = true;
      }

      function shuffle(arr) {
        for (let i = arr.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
      }

      function resetUI() {
        document.getElementById('progressText').textContent = `${current + 1} / ${TOTAL}`;
        document.getElementById('progressFill').style.width = `${(current / TOTAL) * 100}%`;
        document.getElementById('feedbackBox').className = 'feedback-box';
        document.getElementById('nextBtnWrap').className = 'next-btn-wrap';
        document.getElementById('streakBadge').textContent = '';
        document.getElementById('questionSubHint').textContent = '';
        resetHintRewardState();
      }

      function showNextBtn() {
        document.getElementById('nextBtnWrap').className = 'next-btn-wrap show';
      }

      function markWrongWord(word) {
        addReviewWord(level, getWordId(word));
      }

      function markCorrectWord(word) {
        if (mode === 'review') {
          removeReviewWord(level, getWordId(word));
        }
      }

      function applyStreak() {
        let bonus = 0;
        if (streak >= 5) bonus = 10;
        else if (streak >= 3) bonus = 5;
        score += 10 + bonus;
        correctCount++;
        const streakEl = document.getElementById('streakBadge');
        if (streak >= 5) streakEl.textContent = `🔥 ${streak} streak! +10 bonus`;
        else if (streak >= 3) streakEl.textContent = `🔥 ${streak} streak! +5 bonus`;
      }

      function renderQuestion() {
        resetUI();
        const q = questions[current];

        if (!q) {
          showQuizError('Please check your quiz data.');
          return;
        }

        if (level === 'advanced') {
          renderAdvanced(q);
          setupHintRewardUI(q, 'advanced');
        } else if (level === 'expert') {
          renderExpert(q);
          setupHintRewardUI(q, 'expert');
        } else {
          hideHintRewardUI();
          renderMCQ(q);
        }
      }

      function renderMCQ(q) {
        document.getElementById('choicesGrid').style.display = '';

        if (quizDir === 'KO_EN') {
          document.getElementById('questionTypeLabel').textContent = 'What is the English meaning?';
          document.getElementById('questionWord').textContent = q.korean;
          document.getElementById('questionWord').className = 'question-word';
          buildChoices(q, 'english', pool);
        } else {
          document.getElementById('questionTypeLabel').textContent = 'What is the Korean word?';
          document.getElementById('questionWord').textContent = q.english;
          document.getElementById('questionWord').className = 'question-word';
          buildChoices(q, 'korean', pool);
        }
      }

      function buildChoices(q, field, allWords) {
        const correct = q[field];
        const others = shuffle(
          allWords.filter(w => w[field] !== correct).map(w => w[field])
        ).slice(0, 3);
        const options = shuffle([correct, ...others]);

        const feedbackText = q.example || q.hint || '';
        const feedbackLabel = q.example ? 'Example' : (q.hint ? 'Hint' : '');

        const grid = document.getElementById('choicesGrid');
        grid.innerHTML = '';
        options.forEach(opt => {
          const btn = document.createElement('button');
          btn.className = 'choice-btn';
          btn.textContent = opt;
          btn.addEventListener('click', () => {
            handleMCQChoice(btn, opt, correct, feedbackText, feedbackLabel, q);
          });
          grid.appendChild(btn);
        });
      }

      function handleMCQChoice(btn, selected, correct, feedbackText, feedbackLabel, q) {
        document.querySelectorAll('.choice-btn').forEach(b => {
          b.disabled = true;
          if (b.textContent === correct) b.classList.add('correct');
        });

        const fb = document.getElementById('feedbackBox');
        const title = document.getElementById('feedbackTitle');
        const hintEl = document.getElementById('feedbackHint');

        if (selected === correct) {
          btn.classList.add('correct');
          streak++;
          applyStreak();
          markCorrectWord(q);
          fb.className = 'feedback-box correct show';
          title.textContent = '✓ Correct!';
          hintEl.textContent = feedbackText ? `${feedbackLabel}: ${feedbackText}` : '';
        } else {
          btn.classList.add('wrong');
          streak = 0;
          markWrongWord(q);
          fb.className = 'feedback-box wrong show';
          title.textContent = '✗ Wrong!';
          hintEl.textContent = `Correct: ${correct}${feedbackText ? ' · ' + feedbackLabel + ': ' + feedbackText : ''}`;
        }
        showNextBtn();
      }

      function renderAdvanced(q) {
        document.getElementById('choicesGrid').style.display = '';
        document.getElementById('questionTypeLabel').textContent = 'Which word best fits the blank?';
        document.getElementById('questionWord').textContent = q.korean;
        document.getElementById('questionWord').className = 'question-word small';
        document.getElementById('questionSubHint').textContent = q.english;

        const others = shuffle(
          pool.filter(w => w.answer !== q.answer).map(w => w.answer)
        ).slice(0, 3);
        const options = shuffle([q.answer, ...others]);

        const grid = document.getElementById('choicesGrid');
        grid.innerHTML = '';
        options.forEach(opt => {
          const btn = document.createElement('button');
          btn.className = 'choice-btn';
          btn.textContent = opt;
          btn.addEventListener('click', () => handleAdvancedChoice(btn, opt, q));
          grid.appendChild(btn);
        });
      }

      function handleAdvancedChoice(btn, selected, q) {
        lockHintRewardAfterAnswer();
        document.querySelectorAll('.choice-btn').forEach(b => {
          b.disabled = true;
          if (b.textContent === q.answer) b.classList.add('correct');
        });

        const fb = document.getElementById('feedbackBox');
        const title = document.getElementById('feedbackTitle');
        const hintEl = document.getElementById('feedbackHint');
        const fullSentence = q.korean.replace('___', `【${q.answer}】`);

        if (selected === q.answer) {
          btn.classList.add('correct');
          streak++;
          applyStreak();
          markCorrectWord(q);
          fb.className = 'feedback-box correct show';
          title.textContent = '✓ Correct!';
          hintEl.innerHTML = `<strong>${fullSentence}</strong><br><em>${q.english}</em><br>💡 ${q.hint}`;
        } else {
          btn.classList.add('wrong');
          streak = 0;
          markWrongWord(q);
          fb.className = 'feedback-box wrong show';
          title.textContent = '✗ Wrong!';
          hintEl.innerHTML = `<strong>${fullSentence}</strong><br><em>${q.english}</em><br>💡 ${q.hint}`;
        }
        showNextBtn();
      }

      function renderExpert(q) {
        document.getElementById('choicesGrid').style.display = '';
        document.getElementById('questionTypeLabel').textContent = 'What does this mean?';
        document.getElementById('questionWord').textContent = q.korean;
        document.getElementById('questionWord').className = 'question-word';

        // Pick one random meaning to quiz on
        const targetIdx = Math.floor(Math.random() * q.meanings.length);
        const target = q.meanings[targetIdx];

        document.getElementById('questionSubHint').innerHTML =
          `${target.emoji}&nbsp;&nbsp;<em>${target.example}</em>`;

        // Collect wrong options from all other meanings in the pool
        const allEnglish = pool.flatMap(w => w.meanings.map(m => m.english));
        const others = shuffle(
          allEnglish.filter(e => e !== target.english)
        ).slice(0, 3);
        const options = shuffle([target.english, ...others]);

        const grid = document.getElementById('choicesGrid');
        grid.innerHTML = '';
        options.forEach(opt => {
          const btn = document.createElement('button');
          btn.className = 'choice-btn';
          btn.textContent = opt;
          btn.addEventListener('click', () => handleExpertChoice(btn, opt, q, target));
          grid.appendChild(btn);
        });
      }

      function handleExpertChoice(btn, selected, q, target) {
        lockHintRewardAfterAnswer();
        document.querySelectorAll('.choice-btn').forEach(b => {
          b.disabled = true;
          if (b.textContent === target.english) b.classList.add('correct');
        });

        const fb = document.getElementById('feedbackBox');
        const title = document.getElementById('feedbackTitle');
        const hintEl = document.getElementById('feedbackHint');

        const allMeaningsHtml = q.meanings
          .map(m => `${m.emoji} <strong>${m.english}</strong> — <em>${m.example}</em>`)
          .join('<br>');

        if (selected === target.english) {
          btn.classList.add('correct');
          streak++;
          applyStreak();
          markCorrectWord(q);
          fb.className = 'feedback-box correct show';
          title.textContent = '✓ Correct!';
          hintEl.innerHTML =
            `All meanings of <strong>'${q.korean}'</strong>:<br>${allMeaningsHtml}`;
        } else {
          btn.classList.add('wrong');
          streak = 0;
          markWrongWord(q);
          fb.className = 'feedback-box wrong show';
          title.textContent = '✗ Wrong!';
          hintEl.innerHTML =
            `Correct: <strong>${target.english}</strong><br>` +
            `All meanings of <strong>'${q.korean}'</strong>:<br>${allMeaningsHtml}`;
        }
        showNextBtn();
      }

      document.getElementById('nextBtn').addEventListener('click', () => {
        current++;
        if (current >= TOTAL) {
          const query = new URLSearchParams({
            level,
            stage: String(stage),
            mode,
            score: String(score),
            correct: String(correctCount),
            totalQuestions: String(TOTAL),
            streakCurrent: String(streakSummary.current),
            totalStages: String(totalStages),
            v: WEB_VERSION,
          }).toString();
          location.href = `result.html?${query}`;
        } else {
          renderQuestion();
        }
      });

      renderQuestion();
    }
  </script>
</body>
</html>
