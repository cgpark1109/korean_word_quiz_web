<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Quiz – Korean Word Quiz</title>
  <link rel="stylesheet" href="./css/base.css?v=20260525-3">
  <style>
    .top-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px 20px 8px;
    }
    .back-btn {
      background: none;
      border: none;
      font-size: 22px;
      color: var(--text-secondary);
      cursor: pointer;
      padding: 4px;
      flex-shrink: 0;
    }
    .level-badge {
      font-size: 13px;
      font-weight: 600;
      color: var(--gold);
      text-transform: capitalize;
      flex: 1;
    }
    .progress-text {
      font-size: 13px;
      color: var(--text-muted);
      font-weight: 600;
    }
    .progress-bar-wrap {
      padding: 0 20px 16px;
    }
    .progress-bar-bg {
      background: var(--card-bg);
      border-radius: 99px;
      height: 6px;
      overflow: hidden;
    }
    .progress-bar-fill {
      height: 100%;
      background: var(--gold);
      border-radius: 99px;
      transition: width 0.3s ease;
    }
    .question-card {
      margin: 0 20px 20px;
      padding: 28px 20px;
      text-align: center;
      min-height: 140px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    .question-type-label {
      font-size: 12px;
      color: var(--text-muted);
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    .question-word {
      font-size: 30px;
      font-weight: 700;
      color: var(--text-primary);
      line-height: 1.3;
    }
    .question-word.small {
      font-size: 22px;
    }
    .question-hint {
      font-size: 13px;
      color: var(--text-muted);
      font-style: italic;
    }

    /* 4지선다 그리드 */
    .choices-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      padding: 0 20px;
    }
    .choice-btn {
      background: var(--card-bg);
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 16px 10px;
      font-size: 15px;
      font-weight: 600;
      color: var(--text-primary);
      cursor: pointer;
      text-align: center;
      transition: background 0.2s, border-color 0.2s, color 0.2s;
      min-height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1.3;
    }
    .choice-btn.correct {
      background: var(--correct-bg);
      border-color: var(--correct-text);
      color: var(--correct-text);
    }
    .choice-btn.wrong {
      background: var(--wrong-bg);
      border-color: var(--wrong-text);
      color: var(--wrong-text);
    }
    .choice-btn:disabled {
      cursor: default;
    }

    /* 피드백 */
    .feedback-box {
      margin: 16px 20px 0;
      padding: 14px 16px;
      border-radius: var(--radius-sm);
      font-size: 14px;
      display: none;
      line-height: 1.6;
    }
    .feedback-box.show {
      display: block;
    }
    .feedback-box.correct {
      background: var(--correct-bg);
      color: var(--correct-text);
    }
    .feedback-box.wrong {
      background: var(--wrong-bg);
      color: var(--wrong-text);
    }
    .feedback-title {
      font-weight: 700;
      font-size: 15px;
      margin-bottom: 6px;
    }
    .streak-badge {
      margin: 10px 20px 0;
      text-align: center;
      font-size: 13px;
      font-weight: 600;
      color: var(--gold);
      min-height: 20px;
    }
    .next-btn-wrap {
      padding: 16px 20px 0;
      display: none;
    }
    .next-btn-wrap.show {
      display: block;
    }

    /* expert 레벨: 단어 설명 카드 */
    .expert-usage-label {
      font-size: 11px;
      color: var(--text-muted);
      background: var(--bg);
      border-radius: 4px;
      padding: 2px 8px;
    }
  </style>
  <script src="./js/app.js?v=20260525-3"></script>
</head>
<body>
  <div class="top-bar">
    <a class="back-btn" id="backBtn" href="index.html">←</a>
    <span class="level-badge" id="levelBadge"></span>
    <span class="progress-text" id="progressText">1 / 10</span>
  </div>

  <div class="progress-bar-wrap">
    <div class="progress-bar-bg">
      <div class="progress-bar-fill" id="progressFill" style="width:0%"></div>
    </div>
  </div>

  <div class="card question-card">
    <div class="question-type-label" id="questionTypeLabel"></div>
    <div class="question-word" id="questionWord"></div>
    <div class="question-hint" id="questionSubHint"></div>
  </div>

  <!-- 4지선다 -->
  <div class="choices-grid" id="choicesGrid"></div>

  <div class="streak-badge" id="streakBadge"></div>

  <div class="feedback-box" id="feedbackBox">
    <div class="feedback-title" id="feedbackTitle"></div>
    <div id="feedbackHint"></div>
  </div>

  <div class="next-btn-wrap" id="nextBtnWrap">
    <button class="btn-primary" id="nextBtn">Next →</button>
  </div>

  <script>
    const WEB_VERSION =
      new URLSearchParams(window.location.search).get('v') || '20260525-3';
    const requestedLevel =
      new URLSearchParams(location.search).get('level') || 'beginner';
    const supportedLevels = ['beginner', 'intermediate', 'advanced', 'expert'];
    const level = supportedLevels.includes(requestedLevel)
      ? requestedLevel
      : 'beginner';
    const TOTAL = 10;

    const levelIcons = {
      beginner: '🌱',
      intermediate: '🌿',
      advanced: '🌳',
      expert: '⭐',
    };
    const levelNames = {
      beginner: '입문',
      intermediate: '중급',
      advanced: '고급',
      expert: '특급',
    };

    const backUrl = new URL('index.html', location.href);
    backUrl.searchParams.set('v', WEB_VERSION);
    document.getElementById('backBtn').href = backUrl.toString();
    document.getElementById('levelBadge').textContent =
      `${levelIcons[level] || ''} ${levelNames[level] || level}`.trim();

    function showQuizError(message) {
      document.getElementById('choicesGrid').style.display = 'none';
      document.getElementById('questionTypeLabel').textContent =
        '문제를 불러오지 못했습니다';
      document.getElementById('questionWord').textContent = message;
      document.getElementById('questionWord').className = 'question-word small';
      document.getElementById('questionSubHint').textContent = '';
      document.getElementById('feedbackBox').className = 'feedback-box wrong show';
      document.getElementById('feedbackTitle').textContent = '오류';
      document.getElementById('feedbackHint').textContent =
        '단어 데이터가 비어 있거나 로드되지 않았습니다.';
      document.getElementById('nextBtnWrap').className = 'next-btn-wrap';
    }

    const script = document.createElement('script');
    script.src = `js/word-data-${level}.js?v=${encodeURIComponent(WEB_VERSION)}`;
    script.onload = () => initQuiz();
    script.onerror = () => showQuizError('레벨 데이터 파일을 불러오지 못했습니다.');
    document.head.appendChild(script);

    function initQuiz() {
      const wordData = typeof WordData !== 'undefined' ? WordData : {};
      const pool = [...(wordData[level] || [])];

      if (!pool.length) {
        showQuizError('선택한 레벨의 데이터가 없습니다.');
        return;
      }

      shuffle(pool);
      const questions = pool.slice(0, TOTAL);

      let current = 0;
      let score = 0;
      let correctCount = 0;
      let streak = 0;

      function shuffle(arr) {
        for (let i = arr.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
      }

      function resetUI() {
        document.getElementById('progressText').textContent = `${current + 1} / ${TOTAL}`;
        document.getElementById('progressFill').style.width = `${(current / TOTAL) * 100}%`;
        document.getElementById('feedbackBox').className = 'feedback-box';
        document.getElementById('nextBtnWrap').className = 'next-btn-wrap';
        document.getElementById('streakBadge').textContent = '';
        document.getElementById('questionSubHint').textContent = '';
      }

      function showNextBtn() {
        document.getElementById('nextBtnWrap').className = 'next-btn-wrap show';
      }

      function applyStreak() {
        let bonus = 0;
        if (streak >= 5) bonus = 10;
        else if (streak >= 3) bonus = 5;
        score += 10 + bonus;
        correctCount++;
        const streakEl = document.getElementById('streakBadge');
        if (streak >= 5) streakEl.textContent = `🔥 ${streak} streak! +10 bonus`;
        else if (streak >= 3) streakEl.textContent = `🔥 ${streak} streak! +5 bonus`;
      }

      function renderQuestion() {
        resetUI();
        const q = questions[current];

        if (!q) {
          showQuizError('데이터를 다시 확인해주세요.');
          return;
        }

        if (level === 'advanced') {
          renderAdvanced(q);
        } else if (level === 'expert') {
          renderExpert(q);
        } else {
          renderMCQ(q);
        }
      }

      function renderMCQ(q) {
        document.getElementById('choicesGrid').style.display = '';

        const typeA = Math.random() < 0.5;
        if (typeA) {
          document.getElementById('questionTypeLabel').textContent = 'What is the English meaning?';
          document.getElementById('questionWord').textContent = q.korean;
          document.getElementById('questionWord').className = 'question-word';
          buildChoices(q, 'english', pool);
        } else {
          document.getElementById('questionTypeLabel').textContent = 'What is the Korean word?';
          document.getElementById('questionWord').textContent = q.english;
          document.getElementById('questionWord').className = 'question-word';
          buildChoices(q, 'korean', pool);
        }
      }

      function buildChoices(q, field, allWords) {
        const correct = q[field];
        const others = shuffle(
          allWords.filter(w => w[field] !== correct).map(w => w[field])
        ).slice(0, 3);
        const options = shuffle([correct, ...others]);

        const grid = document.getElementById('choicesGrid');
        grid.innerHTML = '';
        options.forEach(opt => {
          const btn = document.createElement('button');
          btn.className = 'choice-btn';
          btn.textContent = opt;
          btn.addEventListener('click', () => {
            handleMCQChoice(btn, opt, correct, q.hint || '');
          });
          grid.appendChild(btn);
        });
      }

      function handleMCQChoice(btn, selected, correct, hint) {
        document.querySelectorAll('.choice-btn').forEach(b => {
          b.disabled = true;
          if (b.textContent === correct) b.classList.add('correct');
        });

        const fb = document.getElementById('feedbackBox');
        const title = document.getElementById('feedbackTitle');
        const hintEl = document.getElementById('feedbackHint');

        if (selected === correct) {
          btn.classList.add('correct');
          streak++;
          applyStreak();
          fb.className = 'feedback-box correct show';
          title.textContent = '✓ Correct!';
          hintEl.textContent = hint ? `Hint: ${hint}` : '';
        } else {
          btn.classList.add('wrong');
          streak = 0;
          fb.className = 'feedback-box wrong show';
          title.textContent = '✗ Wrong!';
          hintEl.textContent = `Correct: ${correct}${hint ? ' · Hint: ' + hint : ''}`;
        }
        showNextBtn();
      }

      function renderAdvanced(q) {
        document.getElementById('choicesGrid').style.display = '';
        document.getElementById('questionTypeLabel').textContent = '빈칸에 알맞은 말은?';
        document.getElementById('questionWord').textContent = q.korean;
        document.getElementById('questionWord').className = 'question-word small';
        document.getElementById('questionSubHint').textContent = q.english;

        const others = shuffle(
          pool.filter(w => w.answer !== q.answer).map(w => w.answer)
        ).slice(0, 3);
        const options = shuffle([q.answer, ...others]);

        const grid = document.getElementById('choicesGrid');
        grid.innerHTML = '';
        options.forEach(opt => {
          const btn = document.createElement('button');
          btn.className = 'choice-btn';
          btn.textContent = opt;
          btn.addEventListener('click', () => handleAdvancedChoice(btn, opt, q));
          grid.appendChild(btn);
        });
      }

      function handleAdvancedChoice(btn, selected, q) {
        document.querySelectorAll('.choice-btn').forEach(b => {
          b.disabled = true;
          if (b.textContent === q.answer) b.classList.add('correct');
        });

        const fb = document.getElementById('feedbackBox');
        const title = document.getElementById('feedbackTitle');
        const hintEl = document.getElementById('feedbackHint');
        const fullSentence = q.korean.replace('___', `【${q.answer}】`);

        if (selected === q.answer) {
          btn.classList.add('correct');
          streak++;
          applyStreak();
          fb.className = 'feedback-box correct show';
          title.textContent = '✓ Correct!';
          hintEl.innerHTML = `<strong>${fullSentence}</strong><br><em>${q.english}</em><br>💡 ${q.hint}`;
        } else {
          btn.classList.add('wrong');
          streak = 0;
          fb.className = 'feedback-box wrong show';
          title.textContent = '✗ Wrong!';
          hintEl.innerHTML = `<strong>${fullSentence}</strong><br><em>${q.english}</em><br>💡 ${q.hint}`;
        }
        showNextBtn();
      }

      function renderExpert(q) {
        document.getElementById('choicesGrid').style.display = '';
        document.getElementById('questionTypeLabel').textContent = 'What is the English meaning?';
        document.getElementById('questionWord').textContent = q.korean;
        document.getElementById('questionWord').className = 'question-word';

        const others = shuffle(
          pool.filter(w => w.english !== q.english).map(w => w.english)
        ).slice(0, 3);
        const options = shuffle([q.english, ...others]);

        const grid = document.getElementById('choicesGrid');
        grid.innerHTML = '';
        options.forEach(opt => {
          const btn = document.createElement('button');
          btn.className = 'choice-btn';
          btn.textContent = opt;
          btn.addEventListener('click', () => handleExpertChoice(btn, opt, q));
          grid.appendChild(btn);
        });
      }

      function handleExpertChoice(btn, selected, q) {
        document.querySelectorAll('.choice-btn').forEach(b => {
          b.disabled = true;
          if (b.textContent === q.english) b.classList.add('correct');
        });

        const fb = document.getElementById('feedbackBox');
        const title = document.getElementById('feedbackTitle');
        const hintEl = document.getElementById('feedbackHint');

        if (selected === q.english) {
          btn.classList.add('correct');
          streak++;
          applyStreak();
          fb.className = 'feedback-box correct show';
          title.textContent = '✓ Correct!';
          hintEl.innerHTML = `동의어: <strong>${q.synonym}</strong><br>예문: <em>${q.usage}</em>`;
        } else {
          btn.classList.add('wrong');
          streak = 0;
          fb.className = 'feedback-box wrong show';
          title.textContent = '✗ Wrong!';
          hintEl.innerHTML = `정답: <strong>${q.english}</strong><br>동의어: ${q.synonym}<br>예문: <em>${q.usage}</em>`;
        }
        showNextBtn();
      }

      document.getElementById('nextBtn').addEventListener('click', () => {
        current++;
        if (current >= TOTAL) {
          const query = new URLSearchParams({
            level,
            score: String(score),
            correct: String(correctCount),
            v: WEB_VERSION,
          }).toString();
          location.href = `result.html?${query}`;
        } else {
          renderQuestion();
        }
      });

      renderQuestion();
    }
  </script>
</body>
</html>
