<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Result – Korean Word Quiz</title>
  <link rel="stylesheet" href="./css/base.css?v=20260624-1">
  <style>
    @keyframes popIn {
      0% { transform: scale(0.3); opacity: 0; }
      70% { transform: scale(1.15); }
      100% { transform: scale(1); opacity: 1; }
    }

    body.result-page {
      display: flex;
      flex-direction: column;
      min-height: 100dvh;
      justify-content: center;
      overflow-y: auto;
    }

    .result-wrap {
      padding: 32px 20px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
      width: 100%;
      box-sizing: border-box;
    }

    .stars-row {
      display: flex;
      gap: 8px;
    }

    .star {
      font-size: 48px;
      opacity: 0;
      animation: popIn 0.4s ease forwards;
    }

    .star:nth-child(1) { animation-delay: 0.1s; }
    .star:nth-child(2) { animation-delay: 0.3s; }
    .star:nth-child(3) { animation-delay: 0.5s; }

    .star.empty {
      filter: grayscale(1);
      opacity: 0;
      animation: popIn 0.4s ease forwards;
      opacity: 0.3;
    }

    .result-heading {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      width: 100%;
    }

    .result-title {
      font-size: 24px;
      font-weight: 700;
      color: var(--text-primary);
      text-align: center;
      line-height: 1.25;
    }

    .result-subtitle {
      font-size: 14px;
      color: var(--text-muted);
      text-align: center;
      line-height: 1.4;
    }

    .retention-note {
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 10px 12px;
      font-size: 13px;
      color: var(--text-secondary);
      text-align: center;
      line-height: 1.45;
      box-sizing: border-box;
    }

    .stats-card {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0;
    }

    .stat-item {
      text-align: center;
      padding: 16px 8px;
      border-right: 1px solid var(--border);
    }

    .stat-item:last-child {
      border-right: none;
    }

    .stat-value {
      font-size: 28px;
      font-weight: 700;
      color: var(--gold);
    }

    .stat-label {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 4px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .action-btns {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .btn-tertiary {
      display: block;
      width: 100%;
      padding: 14px 20px;
      border-radius: var(--radius-sm);
      font-size: 15px;
      font-weight: 600;
      text-align: center;
      text-decoration: none;
      box-sizing: border-box;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-primary);
    }
  </style>
  <script src="./js/app.js?v=20260624-1"></script>
</head>
<body class="result-page">
  <div class="result-wrap">
    <div class="stars-row" id="starsRow"></div>

    <div class="result-heading">
      <div class="result-title" id="resultTitle">Stage Complete! 🎉</div>
      <div class="result-subtitle" id="resultSubtitle"></div>
    </div>

    <div class="retention-note" id="retentionNote">Come back tomorrow for your daily challenge.</div>

    <div class="card stats-card">
      <div class="stat-item">
        <div class="stat-value" id="statScore"></div>
        <div class="stat-label">Score</div>
      </div>
      <div class="stat-item">
        <div class="stat-value" id="statCorrect"></div>
        <div class="stat-label">Correct</div>
      </div>
      <div class="stat-item">
        <div class="stat-value" id="statLevel"></div>
        <div class="stat-label">Stage</div>
      </div>
    </div>

    <div class="action-btns">
      <a class="btn-primary" id="primaryActionLink" href="#" style="display:none;">Next Stage</a>
      <a class="btn-secondary" id="dailyLink" href="#">Daily Challenge</a>
      <a class="btn-tertiary" id="tryAgainLink" href="#">Try Again</a>
      <a class="btn-tertiary" id="stagesLink" href="#">All Stages</a>
      <a class="btn-tertiary" id="reviewLink" href="#" style="display:none;">Start Review →</a>
    </div>
  </div>

  <script>
    const WEB_VERSION =
      new URLSearchParams(window.location.search).get('v') || '20260624-1';
    const params = new URLSearchParams(location.search);
    const level = normalizeStageLevel(params.get('level')) || resolveStageLevel();
    const mode = params.get('mode') || 'stage';
    const stage = parseInt(params.get('stage') || '1', 10);
    const totalStages = parseInt(params.get('totalStages') || '1', 10);
    const score = parseInt(params.get('score') || '0', 10);
    const correct = parseInt(params.get('correct') || '0', 10);
    const totalQuestions = parseInt(params.get('totalQuestions') || '10', 10);
    const streakCurrent = parseInt(params.get('streakCurrent') || '0', 10);

    const levelNames = {
      beginner: 'Beginner',
      intermediate: 'Intermediate',
      advanced: 'Advanced',
      expert: 'Expert',
    };

    trackEvent('quiz_completed');
    if (mode === 'stage') {
      localStorage.setItem(`stage_cleared_${level}_${stage}`, 'true');
    }
    if (mode === 'daily') {
      markDailyCompletedToday();
      setDailyAnsweredCount(level, DAILY_QUESTION_COUNT);
      checkInToday();
    }

    const resultSubtitle =
      mode === 'review'
        ? `${levelNames[level] || level} · Review Session Complete`
        : mode === 'daily'
          ? `${levelNames[level] || level} · Daily Challenge Complete`
          : `${levelNames[level] || level} · Stage ${stage} of ${totalStages}`;
    document.getElementById('resultSubtitle').textContent = resultSubtitle;
    document.getElementById('statScore').textContent = score;
    document.getElementById('statCorrect').textContent = `${correct}/${totalQuestions}`;
    document.getElementById('statLevel').textContent = mode === 'stage' ? stage : '—';

    const retentionNote = document.getElementById('retentionNote');
    if (mode === 'daily') {
      const attendance = getAttendanceStatus();
      retentionNote.textContent =
        attendance.streak > 0
          ? `Daily challenge complete! ${attendance.streak}-day streak.`
          : 'Daily challenge complete! Come back tomorrow.';
    } else if (streakCurrent > 0) {
      retentionNote.textContent = `You are on a ${streakCurrent}-day streak. Keep it going tomorrow!`;
    }

    const starsRow = document.getElementById('starsRow');
    const ratio = totalQuestions > 0 ? correct / totalQuestions : 0;
    let filledStars = 1;
    if (ratio >= 0.8) filledStars = 3;
    else if (ratio >= 0.5) filledStars = 2;

    for (let i = 0; i < 3; i++) {
      const star = document.createElement('span');
      star.textContent = '★';
      if (i < filledStars) {
        star.className = 'star';
        star.style.color = '#F5A623';
      } else {
        star.className = 'star empty';
        star.style.color = '#C9B99A';
        star.style.animationDelay = `${0.1 + i * 0.2}s`;
      }
      starsRow.appendChild(star);
    }

    const retryUrl = new URL('quiz.html', location.href);
    retryUrl.searchParams.set('level', level);
    retryUrl.searchParams.set('mode', mode);
    if (mode === 'stage') {
      retryUrl.searchParams.set('stage', String(stage));
    } else if (mode === 'daily') {
      retryUrl.searchParams.set('count', String(DAILY_QUESTION_COUNT));
    } else if (mode === 'review') {
      retryUrl.searchParams.set('count', String(Math.max(1, Math.min(5, getReviewWordIds(level).length))));
    }
    retryUrl.searchParams.set('v', WEB_VERSION);
    document.getElementById('tryAgainLink').href = retryUrl.toString();

    const stagesUrl = new URL('stages.html', location.href);
    stagesUrl.searchParams.set('level', level);
    stagesUrl.searchParams.set('v', WEB_VERSION);
    document.getElementById('stagesLink').href = stagesUrl.toString();

    const dailyLink = document.getElementById('dailyLink');
    if (isDailyCompletedToday()) {
      dailyLink.style.display = 'none';
    } else {
      dailyLink.href = buildDailyQuizUrl(level, WEB_VERSION);
      dailyLink.addEventListener('click', (event) => {
        event.preventDefault();
        startDailyQuiz(level, WEB_VERSION);
      });
    }

    const primaryActionLink = document.getElementById('primaryActionLink');
    const hasNextStage = mode === 'stage' && stage < totalStages;

    if (hasNextStage) {
      const nextUrl = new URL('quiz.html', location.href);
      nextUrl.searchParams.set('level', level);
      nextUrl.searchParams.set('stage', String(stage + 1));
      nextUrl.searchParams.set('v', WEB_VERSION);
      primaryActionLink.href = nextUrl.toString();
      primaryActionLink.textContent = 'Next Stage';
      primaryActionLink.style.display = 'block';
    } else if (mode === 'stage') {
      primaryActionLink.href = stagesUrl.toString();
      primaryActionLink.textContent = 'View All Stages';
      primaryActionLink.style.display = 'block';
      document.getElementById('stagesLink').style.display = 'none';
    }

    const reviewIds = getReviewWordIds(level);
    const reviewLink = document.getElementById('reviewLink');
    if (reviewIds.length) {
      const reviewUrl = new URL('quiz.html', location.href);
      reviewUrl.searchParams.set('level', level);
      reviewUrl.searchParams.set('mode', 'review');
      reviewUrl.searchParams.set('count', String(Math.min(5, reviewIds.length)));
      reviewUrl.searchParams.set('v', WEB_VERSION);
      reviewLink.href = reviewUrl.toString();
      reviewLink.style.display = 'block';
    }

    window.setTimeout(() => {
      notifyApp('quizCompleted', {
        level,
        stage,
        score,
        correct,
      });
    }, 250);
  </script>
</body>
</html>
