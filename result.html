<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Result – Korean Word Quiz</title>
  <link rel="stylesheet" href="./css/base.css?v=20260624-1">
  <style>
    @keyframes popIn {
      0% { transform: scale(0.3); opacity: 0; }
      70% { transform: scale(1.15); }
      100% { transform: scale(1); opacity: 1; }
    }

    body.result-page {
      display: flex;
      flex-direction: column;
      min-height: 100dvh;
      justify-content: center;
      overflow-y: auto;
    }

    .result-wrap {
      padding: 32px 20px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
      width: 100%;
      box-sizing: border-box;
    }

    .stars-row {
      display: flex;
      gap: 8px;
    }

    .star {
      font-size: 48px;
      opacity: 0;
      animation: popIn 0.4s ease forwards;
    }

    .star:nth-child(1) { animation-delay: 0.1s; }
    .star:nth-child(2) { animation-delay: 0.3s; }
    .star:nth-child(3) { animation-delay: 0.5s; }

    .star.empty {
      filter: grayscale(1);
      opacity: 0;
      animation: popIn 0.4s ease forwards;
      opacity: 0.3;
    }

    .result-heading {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      width: 100%;
    }

    .result-title {
      font-size: 24px;
      font-weight: 700;
      color: var(--text-primary);
      text-align: center;
      line-height: 1.25;
    }

    .result-subtitle {
      font-size: 14px;
      color: var(--text-muted);
      text-align: center;
      line-height: 1.4;
    }

    .retention-note {
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 10px 12px;
      font-size: 13px;
      color: var(--text-secondary);
      text-align: center;
      line-height: 1.45;
      box-sizing: border-box;
    }

    .stats-card {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0;
    }

    .stat-item {
      text-align: center;
      padding: 16px 8px;
      border-right: 1px solid var(--border);
    }

    .stat-item:last-child {
      border-right: none;
    }

    .stat-value {
      font-size: 28px;
      font-weight: 700;
      color: var(--gold);
    }

    .stat-label {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 4px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .action-btns {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .btn-tertiary {
      display: block;
      width: 100%;
      padding: 14px 20px;
      border-radius: var(--radius-sm);
      font-size: 15px;
      font-weight: 600;
      text-align: center;
      text-decoration: none;
      box-sizing: border-box;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-primary);
    }
  </style>
  <script src="./js/app.js?v=20260624-9"></script>
</head>
<body class="result-page">
  <div class="result-wrap">
    <div class="stars-row" id="starsRow"></div>

    <div class="result-heading">
      <div class="result-title" id="resultTitle">Stage Complete! 🎉</div>
      <div class="result-subtitle" id="resultSubtitle"></div>
    </div>

    <div class="retention-note" id="retentionNote">Great work! Pick your next stage anytime.</div>

    <div class="card stats-card">
      <div class="stat-item">
        <div class="stat-value" id="statScore"></div>
        <div class="stat-label">Score</div>
      </div>
      <div class="stat-item">
        <div class="stat-value" id="statCorrect"></div>
        <div class="stat-label">Correct</div>
      </div>
      <div class="stat-item">
        <div class="stat-value" id="statLevel"></div>
        <div class="stat-label">Stage</div>
      </div>
    </div>

    <div class="action-btns">
      <a class="btn-primary" id="primaryActionLink" href="#" style="display:none;">Next Stage</a>
      <a class="btn-tertiary" id="tryAgainLink" href="#">Try Again</a>
      <a class="btn-tertiary" id="homeLink" href="#">Back Home</a>
      <a class="btn-tertiary" id="reviewLink" href="#" style="display:none;">View Wrong Answers</a>
    </div>
  </div>

  <script>
    const WEB_VERSION =
      new URLSearchParams(window.location.search).get('v') || '20260624-9';
    const params = new URLSearchParams(location.search);
    const level = resolveStageLevel();
    const score = parseInt(params.get('score') || '0', 10);
    const correct = parseInt(params.get('correct') || '0', 10);
    const totalQuestions = parseInt(params.get('totalQuestions') || '10', 10);
    const streakCurrent = parseInt(params.get('streakCurrent') || '0', 10);

    trackEvent('quiz_completed');

    document.getElementById('resultSubtitle').textContent =
      'All Levels · 10 Random Questions';
    document.getElementById('statScore').textContent = score;
    document.getElementById('statCorrect').textContent = `${correct}/${totalQuestions}`;
    document.getElementById('statLevel').textContent = 'Mix';

    const retentionNote = document.getElementById('retentionNote');
    if (streakCurrent > 0) {
      retentionNote.textContent = `You are on a ${streakCurrent}-day streak. Keep going!`;
    }

    const starsRow = document.getElementById('starsRow');
    const ratio = totalQuestions > 0 ? correct / totalQuestions : 0;
    let filledStars = 1;
    if (ratio >= 0.8) filledStars = 3;
    else if (ratio >= 0.5) filledStars = 2;

    for (let i = 0; i < 3; i++) {
      const star = document.createElement('span');
      star.textContent = '★';
      if (i < filledStars) {
        star.className = 'star';
        star.style.color = '#F5A623';
      } else {
        star.className = 'star empty';
        star.style.color = '#C9B99A';
        star.style.animationDelay = `${0.1 + i * 0.2}s`;
      }
      starsRow.appendChild(star);
    }

    document.getElementById('tryAgainLink').href = buildRandomQuizUrl(WEB_VERSION);
    document.getElementById('tryAgainLink').textContent = 'Play Again';

    document.getElementById('homeLink').href = buildHomeUrl(WEB_VERSION);

    const primaryActionLink = document.getElementById('primaryActionLink');
    primaryActionLink.href = buildRandomQuizUrl(WEB_VERSION);
    primaryActionLink.textContent = 'Play Again';
    primaryActionLink.style.display = 'block';

    if (countAllReviewWords() > 0) {
      const reviewLink = document.getElementById('reviewLink');
      reviewLink.href = buildWordsListUrl('wrong', WEB_VERSION);
      reviewLink.style.display = 'block';
    }

    window.setTimeout(() => {
      notifyApp('quizCompleted', {
        level,
        score,
        correct,
      });
    }, 250);
  </script>
</body>
</html>
