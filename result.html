<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Result – Korean Word Quiz</title>
  <link rel="stylesheet" href="./css/base.css?v=20260528-1">
  <style>
    @keyframes popIn {
      0% { transform: scale(0.3); opacity: 0; }
      70% { transform: scale(1.15); }
      100% { transform: scale(1); opacity: 1; }
    }

    body.result-page {
      display: flex;
      flex-direction: column;
      min-height: 100dvh;
      justify-content: center;
    }

    .result-wrap {
      padding: 32px 20px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
    }

    .stars-row {
      display: flex;
      gap: 8px;
    }

    .star {
      font-size: 48px;
      opacity: 0;
      animation: popIn 0.4s ease forwards;
    }

    .star:nth-child(1) { animation-delay: 0.1s; }
    .star:nth-child(2) { animation-delay: 0.3s; }
    .star:nth-child(3) { animation-delay: 0.5s; }

    .star.empty {
      filter: grayscale(1);
      opacity: 0;
      animation: popIn 0.4s ease forwards;
      opacity: 0.3;
    }

    .result-title {
      font-size: 24px;
      font-weight: 700;
      color: var(--text-primary);
      text-align: center;
    }

    .result-subtitle {
      font-size: 14px;
      color: var(--text-muted);
      text-align: center;
      margin-top: -12px;
    }

    .stats-card {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0;
    }

    .stat-item {
      text-align: center;
      padding: 16px 8px;
      border-right: 1px solid var(--border);
    }

    .stat-item:last-child {
      border-right: none;
    }

    .stat-value {
      font-size: 28px;
      font-weight: 700;
      color: var(--gold);
    }

    .stat-label {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 4px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .action-btns {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
  </style>
  <script src="./js/app.js?v=20260528-1"></script>
</head>
<body class="result-page">
  <div class="result-wrap">
    <div class="stars-row" id="starsRow"></div>

    <div>
      <div class="result-title" id="resultTitle">Stage Complete! 🎉</div>
      <div class="result-subtitle" id="resultSubtitle"></div>
    </div>

    <div class="card stats-card">
      <div class="stat-item">
        <div class="stat-value" id="statScore"></div>
        <div class="stat-label">Score</div>
      </div>
      <div class="stat-item">
        <div class="stat-value" id="statCorrect"></div>
        <div class="stat-label">Correct</div>
      </div>
      <div class="stat-item">
        <div class="stat-value" id="statLevel"></div>
        <div class="stat-label">Stage</div>
      </div>
    </div>

    <div class="action-btns">
      <a class="btn-primary" id="nextStageLink" href="#" style="display:none;">Next Stage →</a>
      <a class="btn-primary" id="tryAgainLink" href="#">Try Again</a>
      <a class="btn-secondary" id="stagesLink" href="#">All Stages</a>
      <a class="btn-secondary" id="homeLink" href="index.html">Home</a>
    </div>
  </div>

  <script>
    const WEB_VERSION =
      new URLSearchParams(window.location.search).get('v') || '20260528-1';
    const params = new URLSearchParams(location.search);
    const level = params.get('level') || 'beginner';
    const stage = parseInt(params.get('stage') || '1', 10);
    const totalStages = parseInt(params.get('totalStages') || '1', 10);
    const score = parseInt(params.get('score') || '0', 10);
    const correct = parseInt(params.get('correct') || '0', 10);
    const QUESTIONS_PER_STAGE = 10;

    const levelIcons = { beginner: '🌱', intermediate: '🌿', advanced: '🌳', expert: '⭐' };
    const levelNames = {
      beginner: '입문',
      intermediate: '중급',
      advanced: '고급',
      expert: '특급',
    };

    localStorage.setItem(`stage_cleared_${level}_${stage}`, 'true');

    document.getElementById('resultSubtitle').textContent =
      `${levelNames[level] || level} · Stage ${stage} of ${totalStages}`;
    document.getElementById('statScore').textContent = score;
    document.getElementById('statCorrect').textContent = `${correct}/${QUESTIONS_PER_STAGE}`;
    document.getElementById('statLevel').textContent = stage;

    const starsRow = document.getElementById('starsRow');
    let filledStars = 1;
    if (correct >= 8) filledStars = 3;
    else if (correct >= 5) filledStars = 2;

    for (let i = 0; i < 3; i++) {
      const star = document.createElement('span');
      star.textContent = '★';
      if (i < filledStars) {
        star.className = 'star';
        star.style.color = '#F5A623';
      } else {
        star.className = 'star empty';
        star.style.color = '#C9B99A';
        star.style.animationDelay = `${0.1 + i * 0.2}s`;
      }
      starsRow.appendChild(star);
    }

    const retryUrl = new URL('quiz.html', location.href);
    retryUrl.searchParams.set('level', level);
    retryUrl.searchParams.set('stage', String(stage));
    retryUrl.searchParams.set('v', WEB_VERSION);
    document.getElementById('tryAgainLink').href = retryUrl.toString();

    const stagesUrl = new URL('stages.html', location.href);
    stagesUrl.searchParams.set('level', level);
    stagesUrl.searchParams.set('v', WEB_VERSION);
    document.getElementById('stagesLink').href = stagesUrl.toString();

    const homeUrl = new URL('index.html', location.href);
    homeUrl.searchParams.set('v', WEB_VERSION);
    document.getElementById('homeLink').href = homeUrl.toString();

    if (stage < totalStages) {
      const nextUrl = new URL('quiz.html', location.href);
      nextUrl.searchParams.set('level', level);
      nextUrl.searchParams.set('stage', String(stage + 1));
      nextUrl.searchParams.set('v', WEB_VERSION);
      const nextLink = document.getElementById('nextStageLink');
      nextLink.href = nextUrl.toString();
      nextLink.style.display = 'block';
    }

    // 앱 WebView: 스테이지(10문제) 완료마다 알림 → Flutter에서 2회마다 전면광고
    window.setTimeout(() => {
      notifyApp('quizCompleted', {
        level,
        stage,
        score,
        correct,
      });
    }, 250);
  </script>
</body>
</html>
