<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Settings – Korean Word Quiz</title>
  <link rel="stylesheet" href="./css/base.css?v=20260528-1">
  <style>
    .top-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px 20px 8px;
    }
    .back-btn {
      background: none;
      border: none;
      font-size: 15px;
      color: var(--gold);
      cursor: pointer;
      padding: 4px 0;
      font-weight: 600;
    }
    .page-title {
      font-size: 17px;
      font-weight: 700;
      color: var(--text-primary);
    }
    .section {
      padding: 20px 20px 0;
    }
    .section-header {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    .info-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }
    .info-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
    }
    .info-row:last-child {
      border-bottom: none;
    }
    .info-label {
      font-size: 15px;
      color: var(--text-primary);
    }
    .info-value {
      font-size: 14px;
      color: var(--text-muted);
    }
    .link-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px;
      cursor: pointer;
    }
    .link-row:active {
      background: var(--bg);
    }
    .link-label {
      font-size: 15px;
      color: var(--text-primary);
    }
    .link-arrow {
      font-size: 16px;
      color: var(--border);
    }
  </style>
  <script src="./js/app.js?v=20260603-5"></script>
</head>
<body>
  <div class="top-bar">
    <a class="back-btn" href="index.html">← Back</a>
    <span class="page-title">Settings</span>
  </div>

  <div class="section">
    <div class="section-header">About</div>
    <div class="info-card">
      <div class="info-row">
        <span class="info-label">App Version</span>
        <span class="info-value">1.0.0</span>
      </div>
      <div class="info-row">
        <span class="info-label">Developer</span>
        <span class="info-value">GGOOK's Studio</span>
      </div>
    </div>
  </div>

  <div class="section" style="margin-top:16px;">
    <div class="section-header">More Apps</div>
    <div class="info-card">
      <a class="link-row" id="moreAppsLink" href="more-apps.html" style="text-decoration:none;color:inherit;">
        <span class="link-label">More from GGOOK's Studio</span>
        <span class="link-arrow">›</span>
      </a>
    </div>
  </div>

  <div class="section" style="margin-top:16px;">
    <div class="section-header">Support</div>
    <div class="info-card">
      <div class="link-row" onclick="shareWithFriend()">
        <span class="link-label">Share with Friends</span>
        <span class="link-arrow">›</span>
      </div>
      <div class="link-row" onclick="rateApp()">
        <span class="link-label">Rate this App</span>
        <span class="link-arrow">›</span>
      </div>
    </div>
  </div>

  <div class="section" style="margin-top:16px;">
    <div class="section-header">Legal</div>
    <div class="info-card">
      <div class="link-row" onclick="openPrivacy()">
        <span class="link-label">Privacy Policy</span>
        <span class="link-arrow">›</span>
      </div>
    </div>
  </div>

  <script>
    const WEB_VERSION =
      new URLSearchParams(window.location.search).get('v') || '20260528-1';
    const APP_PACKAGE_ID = 'com.kysystemstudio.hangulchallenge';
    const APP_STORE_URL = `https://play.google.com/store/apps/details?id=${APP_PACKAGE_ID}`;
    const SHARE_URL = APP_STORE_URL;
    const SHARE_TEXT_EN =
      'I am using Korean Word Quiz to study Korean vocabulary. Try it out!';

    const backLink = document.querySelector('.back-btn');
    if (backLink) {
      const backUrl = new URL('index.html', location.href);
      backUrl.searchParams.set('v', WEB_VERSION);
      backLink.href = backUrl.toString();
    }

    const moreAppsLink = document.getElementById('moreAppsLink');
    if (moreAppsLink) {
      moreAppsLink.href = buildMoreAppsUrl(WEB_VERSION);
    }

    function fallbackCopyText(text) {
      try {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.setAttribute('readonly', '');
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        ta.setSelectionRange(0, ta.value.length);
        const copied = document.execCommand('copy');
        document.body.removeChild(ta);
        return copied;
      } catch (e) {
        return false;
      }
    }

    async function copyText(text) {
      try {
        if (navigator.clipboard && typeof navigator.clipboard.writeText === 'function') {
          await navigator.clipboard.writeText(text);
          return true;
        }
      } catch (e) {}
      return fallbackCopyText(text);
    }

    async function copyShareMessage() {
      const textToCopy = `${SHARE_TEXT_EN}\n${SHARE_URL}`;
      const copied = await copyText(textToCopy);
      if (copied) {
        trackEvent('share_copy_fallback');
        alert('Share message copied. Paste it and send to your friends.');
      } else {
        alert(`Copy and share this link:\n${SHARE_URL}`);
      }
    }

    async function copyStoreLinkOnly() {
      const copied = await copyText(APP_STORE_URL);
      if (copied) {
        alert('Store link copied. Open it in your browser.');
      } else {
        alert(`Open this store link in your browser:\n${APP_STORE_URL}`);
      }
    }

    async function shareWithFriend() {
      trackEvent('share_clicked');
      const shareMessage = `${SHARE_TEXT_EN}\n${SHARE_URL}`;
      const inAppWebView =
        typeof window.flutter_inappwebview !== 'undefined' &&
        typeof window.flutter_inappwebview.callHandler === 'function';

      if (inAppWebView) {
        const shared = await notifyApp('shareApp', { text: shareMessage });
        if (shared?.ok) {
          trackEvent('share_completed');
          return;
        }
      }

      if (navigator.share) {
        try {
          await navigator.share({
            title: 'Korean Word Quiz',
            text: SHARE_TEXT_EN,
            url: SHARE_URL,
          });
          trackEvent('share_completed');
          return;
        } catch (e) {
          // Use fallback when the share sheet is dismissed/cancelled.
        }
      }
      await copyShareMessage();
    }

    async function rateApp() {
      trackEvent('rate_clicked');
      const opened = await notifyApp('openExternal', { url: APP_STORE_URL });
      if (!opened?.ok) {
        await copyStoreLinkOnly();
      }
    }

    function openPrivacy() {
      const url = 'https://kysystemstudio.com/privacy.html';
      window.location.href = url;
    }
  </script>
</body>
</html>
