<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Stages – Korean Word Quiz</title>
  <link rel="stylesheet" href="./css/base.css?v=20260528-1">
  <style>
    .top-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px 20px 12px;
    }
    .back-btn {
      background: none;
      border: none;
      font-size: 22px;
      color: var(--text-secondary);
      cursor: pointer;
      padding: 4px;
    }
    .page-title {
      font-size: 17px;
      font-weight: 700;
      color: var(--text-primary);
      flex: 1;
    }
    .stage-hint {
      font-size: 13px;
      color: var(--text-muted);
      padding: 0 20px 14px;
      line-height: 1.5;
    }
    .stage-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 0 20px 24px;
    }
    .retention-panel {
      margin: 0 20px 14px;
      padding: 12px 14px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--card-bg);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .retention-meta {
      font-size: 12px;
      color: var(--text-muted);
    }
    .retention-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-secondary);
    }
    .dir-toggle-wrap {
      display: flex;
      gap: 8px;
    }
    .dir-btn {
      flex: 1;
      padding: 10px 8px;
      font-size: 13px;
      font-weight: 600;
      border-radius: var(--radius-sm);
      border: 1.5px solid var(--border);
      background: var(--bg);
      color: var(--text-muted);
      cursor: pointer;
      transition: background 0.18s, border-color 0.18s, color 0.18s;
      text-align: center;
      line-height: 1.3;
    }
    .dir-btn.active {
      background: var(--gold);
      border-color: var(--gold);
      color: #fff;
    }
    .stage-card {
      display: flex;
      align-items: center;
      gap: 14px;
      width: 100%;
      min-height: 72px;
      padding: 14px 18px;
      background: var(--card-bg);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      cursor: pointer;
      text-align: left;
    }
    .stage-card:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }
    .stage-card.cleared {
      border-color: var(--correct-text);
    }
    .stage-num {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--gold);
      color: #fff;
      font-weight: 700;
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .stage-card:disabled .stage-num {
      background: var(--border);
      color: var(--text-muted);
    }
    .stage-info {
      flex: 1;
    }
    .stage-name {
      font-size: 16px;
      font-weight: 700;
      color: var(--text-primary);
    }
    .stage-sub {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 2px;
    }
    .stage-badge {
      font-size: 12px;
      font-weight: 600;
      color: var(--correct-text);
    }
    .stage-lock {
      font-size: 18px;
      color: var(--text-muted);
    }
  </style>
  <script src="./js/app.js?v=20260603-5"></script>
  <script>
    (function () {
      const params = new URLSearchParams(location.search);
      if (params.get('level')) {
        sessionStorage.removeItem('force_daily_quiz');
        return;
      }
      if (sessionStorage.getItem('force_daily_quiz') !== '1') return;
      sessionStorage.removeItem('force_daily_quiz');
      const level = resolveStageLevel();
      const version = params.get('v') || '20260603-5';
      const target = new URL('quiz.html', location.href);
      target.searchParams.set('level', level);
      target.searchParams.set('mode', 'daily');
      target.searchParams.set('daily', '1');
      target.searchParams.set('count', '3');
      target.searchParams.set('source', 'home');
      target.searchParams.set('v', version);
      location.replace(target.toString());
    })();
  </script>
</head>
<body>
  <div class="top-bar">
    <a class="back-btn" id="backBtn" href="index.html">←</a>
    <div class="page-title" id="pageTitle">Stages</div>
  </div>
  <p class="stage-hint" id="stageHint">Each stage has 10 questions.</p>
  <div class="retention-panel">
    <div class="retention-meta" id="streakMeta">Current streak: 0 days</div>
    <div id="dirPanel" style="display:none;">
      <div class="retention-label">Quiz direction</div>
      <div class="dir-toggle-wrap">
        <button type="button" class="dir-btn active" id="dirBtnKO">Korean → English</button>
        <button type="button" class="dir-btn" id="dirBtnEN">English → Korean</button>
      </div>
    </div>
  </div>
  <div class="stage-list" id="stageList"></div>

  <script>
    const WEB_VERSION =
      new URLSearchParams(window.location.search).get('v') || '20260603-5';
    const QUESTIONS_PER_STAGE = 10;
    const level = resolveStageLevel();
    const wordCounts = {
      beginner: 210,
      intermediate: 150,
      advanced: 130,
      expert: 140,
    };
    const levelIcons = {
      beginner: '🌱',
      intermediate: '🌿',
      advanced: '🌳',
      expert: '⭐',
    };
    const levelNames = {
      beginner: 'Beginner',
      intermediate: 'Intermediate',
      advanced: 'Advanced',
      expert: 'Expert',
    };

    const totalWords = wordCounts[level] || 30;
    const totalStages = Math.ceil(totalWords / QUESTIONS_PER_STAGE);

    document.getElementById('pageTitle').textContent =
      `${levelIcons[level] || ''} ${levelNames[level] || level} · Stages`.trim();
    document.getElementById('stageHint').textContent =
      `${totalStages} stages · 10 questions each · ${totalWords} words total`;

    function formatDayCount(count) {
      return `${count} ${count === 1 ? 'day' : 'days'}`;
    }

    const streak = getPlayStreak();
    document.getElementById('streakMeta').textContent =
      streak.current > 0
        ? `Current streak ${formatDayCount(streak.current)} · Best ${formatDayCount(streak.best)}`
        : 'Use Daily 3 from Home to start your streak';

    const backUrl = new URL('index.html', location.href);
    backUrl.searchParams.set('v', WEB_VERSION);
    document.getElementById('backBtn').href = backUrl.toString();

    function stageKey(n) {
      return `stage_cleared_${level}_${n}`;
    }

    function isUnlocked(n) {
      if (n === 1) return true;
      return localStorage.getItem(stageKey(n - 1)) === 'true';
    }

    function isCleared(n) {
      return localStorage.getItem(stageKey(n)) === 'true';
    }

    if (supportsQuizDirection(level)) {
      const dirPanel = document.getElementById('dirPanel');
      const btnKO = document.getElementById('dirBtnKO');
      const btnEN = document.getElementById('dirBtnEN');
      dirPanel.style.display = 'flex';
      dirPanel.style.flexDirection = 'column';
      dirPanel.style.gap = '8px';

      function applyDirUI() {
        const dir = getQuizDirection(level);
        btnKO.classList.toggle('active', dir === 'KO_EN');
        btnEN.classList.toggle('active', dir === 'EN_KO');
      }
      applyDirUI();

      btnKO.addEventListener('click', () => {
        setQuizDirection(level, 'KO_EN');
        applyDirUI();
      });
      btnEN.addEventListener('click', () => {
        setQuizDirection(level, 'EN_KO');
        applyDirUI();
      });
    }

    const list = document.getElementById('stageList');
    for (let n = 1; n <= totalStages; n++) {
      const start = (n - 1) * QUESTIONS_PER_STAGE + 1;
      const end = Math.min(n * QUESTIONS_PER_STAGE, totalWords);
      const unlocked = isUnlocked(n);
      const cleared = isCleared(n);

      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'stage-card' + (cleared ? ' cleared' : '');
      btn.disabled = !unlocked;

      btn.innerHTML = `
        <span class="stage-num">${n}</span>
        <span class="stage-info">
          <div class="stage-name">Stage ${n}</div>
          <div class="stage-sub">Words ${start}–${end} · 10 questions</div>
        </span>
        ${cleared ? '<span class="stage-badge">✓ Done</span>' : (unlocked ? '<span class="stage-badge" style="color:var(--gold)">Play →</span>' : '<span class="stage-lock">🔒</span>')}
      `;

      if (unlocked) {
        btn.addEventListener('click', () => {
          const url = new URL('quiz.html', location.href);
          url.searchParams.set('level', level);
          url.searchParams.set('stage', String(n));
          url.searchParams.set('v', WEB_VERSION);
          location.href = url.toString();
        });
      }

      list.appendChild(btn);
    }
  </script>
</body>
</html>
