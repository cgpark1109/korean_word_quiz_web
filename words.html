<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Your Words – Korean Word Quiz</title>
  <link rel="stylesheet" href="./css/base.css?v=20260624-9">
  <style>
    body.words-page {
      min-height: 100dvh;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding-bottom: 8px;
    }
    .top-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 16px 4px;
    }
    .back-btn {
      background: none;
      border: none;
      font-size: 20px;
      color: var(--text-secondary);
      cursor: pointer;
      padding: 2px;
      text-decoration: none;
      line-height: 1;
    }
    .page-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--text-primary);
      flex: 1;
    }
    .page-intro {
      font-size: 12px;
      color: var(--text-muted);
      line-height: 1.4;
      padding: 0 16px 8px;
      margin: 0;
    }
    .word-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 0 16px 12px;
    }
    .word-item {
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--card-bg);
      padding: 10px 12px;
    }
    .word-level {
      display: inline-block;
      font-size: 10px;
      font-weight: 700;
      color: var(--text-muted);
      letter-spacing: 0.03em;
      text-transform: uppercase;
      margin-bottom: 4px;
    }
    .word-primary {
      font-size: 17px;
      font-weight: 700;
      color: var(--text-primary);
      line-height: 1.3;
      margin-bottom: 2px;
    }
    .word-answer {
      font-weight: 700;
      color: var(--gold);
    }
    .word-secondary {
      font-size: 13px;
      color: var(--text-secondary);
      line-height: 1.4;
    }
    .empty-text {
      margin: 8px 16px 12px;
      padding: 14px 12px;
      text-align: center;
      color: var(--text-muted);
      font-size: 13px;
      line-height: 1.5;
      border: 1px dashed var(--border);
      border-radius: var(--radius-sm);
      background: var(--card-bg);
    }
  </style>
  <script src="./js/app.js?v=20260624-13"></script>
  <script src="./js/review-format.js?v=20260624-13"></script>
</head>
<body class="words-page">
  <div class="top-bar">
    <a class="back-btn" id="backBtn" href="index.html">←</a>
    <div class="page-title" id="pageTitle">Your Words</div>
  </div>
  <p class="page-intro" id="pageIntro"></p>

  <div class="word-list" id="wordList"></div>
  <div class="empty-text" id="emptyText" style="display:none;">No words saved yet.</div>

  <script>
    const WEB_VERSION =
      new URLSearchParams(window.location.search).get('v') || '20260624-13';
    const listType =
      new URLSearchParams(window.location.search).get('type') === 'learned'
        ? 'learned'
        : 'wrong';
    const LEVEL_ICONS = {
      beginner: '🌱',
      intermediate: '🌿',
      advanced: '🌳',
      expert: '⭐',
    };

    const backUrl = new URL('index.html', location.href);
    backUrl.searchParams.set('v', WEB_VERSION);
    document.getElementById('backBtn').href = backUrl.toString();

    document.getElementById('pageTitle').textContent =
      listType === 'learned' ? 'Learned Words' : 'Wrong Answers';
    document.getElementById('pageIntro').textContent =
      listType === 'learned'
        ? 'Correct answers — view only'
        : 'Missed words — view only';

    function getWordSummary(word, level, options) {
      options = options || {};
      if (typeof buildReviewWordSummary === 'function') {
        return buildReviewWordSummary(word, level, options);
      }
      if (typeof formatWordSummary === 'function') {
        return formatWordSummary(word, level, options);
      }
      return {
        primary: (word && word.korean) || '',
        secondary: (word && word.english) || '',
      };
    }

    function renderPrimaryLine(container, summary) {
      const parts = summary.primaryParts;
      if (parts && parts.emphasize) {
        container.append(document.createTextNode(parts.before));
        const answerEl = document.createElement('strong');
        answerEl.className = 'word-answer';
        answerEl.textContent = parts.answer;
        container.appendChild(answerEl);
        container.append(document.createTextNode(parts.after));
        return;
      }
      container.textContent = summary.primary;
    }

    function renderWordItem(entry, word) {
      const el = document.createElement('article');
      el.className = 'word-item';
      const summary = getWordSummary(word, entry.level, {
        emphasizeAnswer: listType === 'wrong',
      });
      const levelLabel = LEVEL_DISPLAY_NAMES[entry.level] || entry.level;

      const levelEl = document.createElement('div');
      levelEl.className = 'word-level';
      levelEl.textContent =
        `${LEVEL_ICONS[entry.level] || ''} ${levelLabel}`.trim();

      const primaryEl = document.createElement('div');
      primaryEl.className = 'word-primary';
      renderPrimaryLine(primaryEl, summary);

      const secondaryEl = document.createElement('div');
      secondaryEl.className = 'word-secondary';
      secondaryEl.textContent = summary.secondary;

      el.append(levelEl, primaryEl, secondaryEl);
      return el;
    }

    async function loadWordsPage() {
      const list = document.getElementById('wordList');
      const empty = document.getElementById('emptyText');
      list.innerHTML = '';

      try {
        if (typeof loadAllWordPools !== 'function') {
          throw new Error('App script is not loaded.');
        }

        const pools = await loadAllWordPools(WEB_VERSION);
        const entries = getAllSavedWordEntries(listType);
        const items = entries
          .map(entry => {
            const word = findWordInPools(pools, entry.level, entry.wordId);
            return word ? { entry, word } : null;
          })
          .filter(Boolean);

        if (!items.length) {
          empty.textContent = entries.length
            ? 'Saved words could not be matched to the word list.'
            : 'No words saved yet.';
          empty.style.display = 'block';
          return;
        }

        empty.style.display = 'none';
        items.forEach(({ entry, word }) => {
          list.appendChild(renderWordItem(entry, word));
        });
      } catch (e) {
        console.error('loadWordsPage failed', e);
        empty.textContent = 'Failed to load saved words.';
        empty.style.display = 'block';
      }
    }

    loadWordsPage();
  </script>
</body>
</html>
